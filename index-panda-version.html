<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>TOKI - AI助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: #FFFFFF;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        .app { display: flex; flex-direction: column; height: 100%; }
        
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 100px;
            -webkit-overflow-scrolling: touch;
        }
        
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        
        .panda-avatar {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }
        
        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        
        .welcome-desc {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }
        
        .quick-btn {
            padding: 16px;
            background: #f7f7f7;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            color: #333;
            cursor: pointer;
            text-align: left;
        }
        
        .quick-btn:active { background: #e8e8e8; transform: scale(0.98); }
        
        .msg { margin-bottom: 16px; animation: slideUp 0.3s ease; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .msg-user { display: flex; justify-content: flex-end; }
        .msg-bot { display: flex; gap: 10px; }
        
        .msg-avatar {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }
        
        .msg-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 16px;
        }
        
        .msg-user .msg-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }
        
        .msg-bot .msg-bubble {
            background: #f7f7f7;
            color: #1a1a1a;
            border-bottom-left-radius: 6px;
        }
        
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #f0f0f0;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
        
        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: #f7f7f7;
            border-radius: 24px;
            padding: 8px 16px;
        }
        
        #input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            resize: none;
            max-height: 100px;
            outline: none;
        }
        
        .mic-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
        }
        
        .mic-btn.recording { background: #F44336; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .menu-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1);
            z-index: 200;
            transition: right 0.3s ease;
        }
        
        .sidebar.open { right: 0; }
        
        .sidebar-header { padding: 20px; border-bottom: 1px solid #f0f0f0; }
        .sidebar-title { font-size: 20px; font-weight: 600; }
        .sidebar-subtitle { font-size: 14px; color: #999; margin-top: 4px; }
        
        .sidebar-menu { padding: 8px; }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
        }
        
        .menu-item:active { background: #f7f7f7; }
        .menu-icon { font-size: 20px; }
        .menu-label { font-size: 16px; color: #333; }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .overlay.show { opacity: 1; visibility: visible; }
    </style>
</head>
<body>
    <div class="app">
        <main class="chat" id="chat">
            <div class="welcome" id="welcome">
                <!-- 熊猫头像 -->
                <svg class="panda-avatar" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#FFFFFF"/>
                    <ellipse cx="20" cy="15" rx="12" ry="14" fill="#1a1a1a"/>
                    <ellipse cx="80" cy="15" rx="12" ry="14" fill="#1a1a1a"/>
                    <ellipse cx="20" cy="16" rx="7" ry="9" fill="#FFB6C1" opacity="0.5"/>
                    <ellipse cx="80" cy="16" rx="7" ry="9" fill="#FFB6C1" opacity="0.5"/>
                    <ellipse cx="35" cy="45" rx="14" ry="16" fill="#1a1a1a" transform="rotate(-10 35 45)"/>
                    <ellipse cx="65" cy="45" rx="14" ry="16" fill="#1a1a1a" transform="rotate(10 65 45)"/>
                    <ellipse cx="35" cy="45" rx="8" ry="10" fill="#FFFFFF" transform="rotate(-10 35 45)"/>
                    <ellipse cx="65" cy="45" rx="8" ry="10" fill="#FFFFFF" transform="rotate(10 65 45)"/>
                    <circle cx="35" cy="43" r="5" fill="#667eea"/>
                    <circle cx="65" cy="43" r="5" fill="#667eea"/>
                    <circle cx="36" cy="41" r="2" fill="#FFFFFF"/>
                    <circle cx="66" cy="41" r="2" fill="#FFFFFF"/>
                    <ellipse cx="50" cy="62" rx="6" ry="4" fill="#1a1a1a"/>
                    <path d="M 42 70 Q 50 78 58 70" stroke="#1a1a1a" stroke-width="2" fill="none"/>
                    <circle cx="50" cy="30" r="8" fill="#764ba2" opacity="0.3"/>
                    <circle cx="50" cy="30" r="5" fill="#667eea" opacity="0.5"/>
                </svg>
                
                <h1 class="welcome-title">你好，我是TOKI</h1>
                <p class="welcome-desc">
                    我是你的AI助手<br>
                    可以回答问题、画画、聊天
                </p>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="quickAsk('介绍一下你自己')">介绍一下你自己</button>
                    <button class="quick-btn" onclick="quickAsk('画一只可爱的猫咪')">画一只可爱的猫咪 🎨</button>
                    <button class="quick-btn" onclick="quickAsk('今天有什么新闻')">今天有什么新闻</button>
                    <button class="quick-btn" onclick="quickAsk('写一首关于春天的诗')">写一首关于春天的诗</button>
                </div>
            </div>
        </main>
        
        <div class="input-area">
            <div class="input-box">
                <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="handleKey(event)"></textarea>
                <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
            </div>
        </div>
        
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">功能菜单</div>
                <div class="sidebar-subtitle">更多功能等你探索</div>
            </div>
            <nav class="sidebar-menu">
                <div class="menu-item" onclick="clearChat()">
                    <span class="menu-icon">🗑️</span>
                    <span class="menu-label">清除对话</span>
                </div>
                <div class="menu-item" onclick="showMemory()">
                    <span class="menu-icon">🧠</span>
                    <span class="menu-label">记忆系统</span>
                </div>
                <div class="menu-item" onclick="showAbout()">
                    <span class="menu-icon">ℹ️</span>
                    <span class="menu-label">关于TOKI</span>
                </div>
            </nav>
        </aside>
        
        <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    </div>
    
    <script>
        const BASE_URL = 'https://open.bigmodel.cn/api/paas/v4';
        const API_KEY = '9cae1ef67a4c4f31b30bb1f0b32f39e2.bO8PqKcVnJmVbNgm';
        
        let isRecording = false;
        let recognition = null;
        let history = [];
        
        // 熊猫头像SVG（用于消息）
        const pandaSVG = `<svg viewBox="0 0 100 100" style="width:36px;height:36px">
            <circle cx="50" cy="50" r="45" fill="#FFFFFF"/>
            <ellipse cx="20" cy="15" rx="12" ry="14" fill="#1a1a1a"/>
            <ellipse cx="80" cy="15" rx="12" ry="14" fill="#1a1a1a"/>
            <ellipse cx="35" cy="45" rx="14" ry="16" fill="#1a1a1a" transform="rotate(-10 35 45)"/>
            <ellipse cx="65" cy="45" rx="14" ry="16" fill="#1a1a1a" transform="rotate(10 65 45)"/>
            <ellipse cx="35" cy="45" rx="8" ry="10" fill="#FFFFFF" transform="rotate(-10 35 45)"/>
            <ellipse cx="65" cy="45" rx="8" ry="10" fill="#FFFFFF" transform="rotate(10 65 45)"/>
            <circle cx="35" cy="43" r="5" fill="#667eea"/>
            <circle cx="65" cy="43" r="5" fill="#667eea"/>
            <ellipse cx="50" cy="62" rx="6" ry="4" fill="#1a1a1a"/>
            <path d="M 42 70 Q 50 78 58 70" stroke="#1a1a1a" stroke-width="2" fill="none"/>
            <circle cx="50" cy="30" r="5" fill="#667eea" opacity="0.5"/>
        </svg>`;
        
        function initSpeech() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'zh-CN';
                
                recognition.onresult = (e) => {
                    document.getElementById('input').value = e.results[0][0].transcript;
                    stopMic();
                    send();
                };
                
                recognition.onerror = () => stopMic();
                recognition.onend = () => stopMic();
            }
        }
        
        function toggleMic() {
            isRecording ? stopMic() : startMic();
        }
        
        function startMic() {
            if (recognition) {
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                recognition.start();
            } else {
                alert('您的浏览器不支持语音识别');
            }
        }
        
        function stopMic() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            if (recognition) recognition.stop();
        }
        
        function quickAsk(text) {
            document.getElementById('input').value = text;
            send();
        }
        
        async function send() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;
            
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.style.display = 'none';
            
            addMsg(text, 'user');
            input.value = '';
            
            const loadingId = showLoading();
            
            try {
                const reply = await callAPI(text);
                removeLoading(loadingId);
                await addMsgWithTyping(reply, 'bot');
            } catch (err) {
                removeLoading(loadingId);
                addMsg('抱歉，我遇到了一些问题，请稍后再试。', 'bot');
            }
            
            scrollDown();
        }
        
        function addMsg(content, type) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg msg-${type}`;
            
            if (type === 'user') {
                div.innerHTML = `<div class="msg-bubble">${content}</div>`;
            } else {
                div.innerHTML = `<div class="msg-avatar">${pandaSVG}</div><div class="msg-bubble">${formatMarkdown(content)}</div>`;
            }
            
            chat.appendChild(div);
            history.push({ role: type, content });
        }
        
        async function addMsgWithTyping(content, type) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg msg-${type}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            
            div.innerHTML = `<div class="msg-avatar">${pandaSVG}</div>`;
            div.appendChild(bubble);
            chat.appendChild(div);
            
            let index = 0;
            const plainText = content.replace(/<[^>]*>/g, '');
            
            return new Promise((resolve) => {
                const timer = setInterval(() => {
                    if (index < plainText.length) {
                        bubble.textContent = plainText.substring(0, index + 1);
                        index++;
                        scrollDown();
                    } else {
                        clearInterval(timer);
                        bubble.innerHTML = formatMarkdown(content);
                        history.push({ role: type, content });
                        resolve();
                    }
                }, 30);
            });
        }
        
        function formatMarkdown(text) {
            return text
                .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }
        
        function showLoading() {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            const id = 'loading-' + Date.now();
            div.id = id;
            div.className = 'msg msg-bot';
            div.innerHTML = `<div class="msg-avatar">${pandaSVG}</div><div class="msg-bubble" style="display:flex;gap:4px;padding:12px;"><span style="width:8px;height:8px;background:#999;border-radius:50%;animation:typing 1.4s infinite"></span><span style="width:8px;height:8px;background:#999;border-radius:50%;animation:typing 1.4s infinite 0.2s"></span><span style="width:8px;height:8px;background:#999;border-radius:50%;animation:typing 1.4s infinite 0.4s"></span></div>`;
            chat.appendChild(div);
            return id;
        }
        
        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        
        async function callAPI(msg) {
            if (msg.includes('画') || msg.includes('生成图')) {
                const res = await fetch(`${BASE_URL}/images/generations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: 'cogview-3-flash', prompt: msg })
                });
                const data = await res.json();
                return `<img src="${data.data[0].url}" alt="生成的图片" style="max-width:100%;border-radius:12px;margin-top:8px">`;
            }
            
            const messages = history.slice(-10).map(h => ({
                role: h.role === 'user' ? 'user' : 'assistant',
                content: h.content.replace(/<[^>]*>/g, '')
            }));
            messages.push({ role: 'user', content: msg });
            
            const res = await fetch(`${BASE_URL}/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                body: JSON.stringify({ model: 'glm-4-flash', messages })
            });
            
            const data = await res.json();
            return data.choices[0].message.content;
        }
        
        function scrollDown() {
            const chat = document.getElementById('chat');
            chat.scrollTop = chat.scrollHeight;
        }
        
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        }
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        function clearChat() {
            closeSidebar();
            location.reload();
        }
        
        function showMemory() {
            closeSidebar();
            alert('记忆系统开发中...');
        }
        
        function showAbout() {
            closeSidebar();
            alert('TOKI V3.2 - 熊猫版\n\n四川大熊猫AI助手\n\n功能：\n- 智能对话\n- 图像生成\n- 语音输入');
        }
        
        window.onload = () => initSpeech();
    </script>
</body>
</html>
