<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKI V5 - 你的智能秘书</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --accent: #7B68EE;
            --dark: #1A1A2E;
            --light: #F5F7FA;
            --white: #FFFFFF;
            --gray: #95A5A6;
            --gray-light: #ECF0F1;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.12);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ========== 顶部导航栏 ========== */
        .top-bar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .top-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            width: 40px;
            height: 40px;
            background: var(--light);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .menu-btn:hover {
            background: var(--primary);
            color: var(--white);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: bold;
            color: var(--dark);
        }
        
        .logo-icon {
            font-size: 32px;
        }
        
        .top-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            background: var(--light);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .icon-btn:hover {
            background: var(--primary);
            color: var(--white);
        }
        
        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            gap: 20px;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-lg);
            display: none;
        }
        
        .sidebar.active {
            display: block;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--gray-light);
        }
        
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--light);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--dark);
        }
        
        .menu-item:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateX(4px);
        }
        
        .menu-item.active {
            background: var(--primary);
            color: var(--white);
        }
        
        .menu-icon {
            font-size: 20px;
        }
        
        /* 聊天区域 */
        .chat-area {
            flex: 1;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--gray-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--dark);
        }
        
        .chat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--gray);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #28a745;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 消息列表 */
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message-wrapper {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }
        
        .message-wrapper.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .avatar.bot {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        }
        
        .avatar.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .message {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
        }
        
        .message.bot {
            background: var(--light);
            color: var(--dark);
            border-bottom-left-radius: 4px;
        }
        
        .message.user {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: var(--white);
            border-bottom-right-radius: 4px;
        }
        
        /* 底部输入区 */
        .input-section {
            border-top: 1px solid var(--gray-light);
            padding: 16px 20px;
            background: var(--white);
        }
        
        /* 快捷功能栏（小字） */
        .quick-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            margin-bottom: 12px;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        .quick-bar::-webkit-scrollbar {
            height: 4px;
        }
        
        .quick-bar::-webkit-scrollbar-thumb {
            background: var(--gray-light);
            border-radius: 2px;
        }
        
        .quick-btn {
            padding: 6px 14px;
            background: var(--light);
            border: 1px solid var(--gray-light);
            border-radius: 20px;
            font-size: 13px;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .quick-btn:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .quick-btn .icon {
            font-size: 14px;
        }
        
        /* 输入框 */
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .message-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--gray-light);
            border-radius: 16px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: var(--light);
        }
        
        .message-input:focus {
            border-color: var(--primary);
            background: var(--white);
        }
        
        .action-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: var(--white);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(74,144,226,0.4);
        }
        
        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .main-content {
                padding: 10px;
            }
            
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 200;
                box-shadow: 4px 0 20px rgba(0,0,0,0.2);
            }
            
            .message-wrapper {
                max-width: 90%;
            }
            
            .top-bar {
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="top-bar">
        <div class="top-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="logo">
                <span class="logo-icon">🐼</span>
                <span>TOKI</span>
            </div>
        </div>
        <div class="top-right">
            <button class="icon-btn" title="设置">⚙️</button>
            <button class="icon-btn" title="通知">🔔</button>

        </div>
    </header>
    
    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">功能菜单</div>
            <div class="sidebar-menu">
                <a href="#" class="menu-item active">

                <a href="#" class="menu-item">

                </a>

                </a>

                </a>
                <a href="#" class="menu-item">
                    <span class="menu-icon">📄</span>
                    <span>文档助手</span>
                </a>
                <a href="#" class="menu-item">
                    <span class="menu-icon">🎤</span>
                    <span>语音助手</span>
                </a>
                <a href="#" class="menu-item">
                    <span class="menu-icon">👤</span>
                    <span>个人中心</span>
                </a>
            </div>
        </aside>
        
        <!-- 聊天区域 -->
        <section class="chat-area">
            <div class="chat-header">
                <div class="chat-title">智能对话</div>
                <div class="chat-status">
                    <span class="status-dot"></span>
                    <span>阿里云 AI 在线</span>
                </div>
            </div>
            
            <div class="message-list" id="messageList">
                <div class="message-wrapper">
                    <div class="avatar bot">🐼</div>
                    <div class="message bot">
                        你好！我是 TOKI，你的智能秘书 👋<br><br>
                        我可以帮你写邮件、做计划、翻译文档、识别图片等等。<br>
                        有什么可以帮你的吗？
                    </div>
                </div>
            </div>
            
            <!-- 底部输入区 -->
            <div class="input-section">
                <!-- 快捷功能栏（小字） -->
                <div class="quick-bar">
                    <button class="quick-btn" onclick="quickAsk('写一封邮件')">
                        <span class="icon">📧</span>
                        <span>写邮件</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('总结文档')">
                        <span class="icon">📄</span>
                        <span>总结文档</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('翻译')">
                        <span class="icon">🌐</span>
                        <span>翻译</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('日程安排')">
                        <span class="icon">📅</span>
                        <span>日程</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('识别图片')">
                        <span class="icon">📸</span>
                        <span>识图</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('写代码')">
                        <span class="icon">💻</span>
                        <span>代码</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('PPT 制作')">
                        <span class="icon">📊</span>
                        <span>PPT</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('Word 转 PDF')">
                        <span class="icon">📝</span>
                        <span>转 PDF</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('生成图表')">
                        <span class="icon">📈</span>
                        <span>图表</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('天气查询')">
                        <span class="icon">🌤️</span>
                        <span>天气</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('搜索')">
                        <span class="icon">🔍</span>
                        <span>搜索</span>
                    </button>
                    <button class="quick-btn" onclick="quickAsk('计算器')">
                        <span class="icon">🧮</span>
                        <span>计算</span>
                    </button>
                </div>
                
                <!-- 输入框 -->
                <div class="input-wrapper">
                    <input type="text" class="message-input" id="messageInput" placeholder="输入消息，或点击上方快捷功能..." onkeypress="handleKeyPress(event)">
                    <button class="action-btn" onclick="sendMessage()" title="发送">➤</button>
                    <button class="action-btn" onclick="toggleVoice()" title="语音">🎤</button>
                    <button class="action-btn" onclick="uploadFile()" title="上传文件">📎</button>
                </div>
            </div>
        </section>
    </main>
    
    <script>
        let chatHistory = [];
        let isWaitingResponse = false;
        
        // 切换侧边栏
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }
        
        // 发送消息
        async function sendMessage() {
            if (isWaitingResponse) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            
            showTypingIndicator();
            isWaitingResponse = true;
            
            // TODO: 接入阿里云 API
            setTimeout(() => {
                removeTypingIndicator();
                addMessage('收到你的消息了！这是模拟回复，实际功能需要接入 AI 后端。', 'bot');
                isWaitingResponse = false;
            }, 1000);
        }
        
        // 快捷提问
        function quickAsk(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }
        
        // 添加消息
        function addMessage(text, type) {
            const messageList = document.getElementById('messageList');
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper ' + type;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar ' + type;
            avatar.textContent = type === 'bot' ? '🐼' : '👤';
            
            const message = document.createElement('div');
            message.className = 'message ' + type;
            message.innerHTML = text.replace(/\n/g, '<br>');
            
            if (type === 'user') {
                wrapper.appendChild(message);
                wrapper.appendChild(avatar);
            } else {
                wrapper.appendChild(avatar);
                wrapper.appendChild(message);
            }
            
            messageList.appendChild(wrapper);
            messageList.scrollTop = messageList.scrollHeight;
        }
        
        // 回车发送
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 语音输入
        function toggleVoice() {
            alert('语音功能开发中...');
        }
        
        // 上传文件
        function uploadFile() {
            alert('上传功能开发中...');
        }
        
        // 显示正在输入
        function showTypingIndicator() {
            // TODO: 实现加载动画
        }
        
        // 移除正在输入
        function removeTypingIndicator() {
            // TODO: 移除加载动画
        }
        
        console.log('TOKI V5 Desktop 已加载 🐼');
    </script>
</body>
</html>
