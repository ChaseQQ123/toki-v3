<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKI V4.0 - AI Panda Assistant</title>
    <meta name="description" content="TOKI - 来自四川的熊猫AI助手，支持语音通话、图像识别、智能对话">
    <meta name="theme-color" content="#667eea">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        /* 头部 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo { font-size: 28px; }
        .title { font-size: 20px; font-weight: bold; }
        .version { background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 10px; font-size: 11px; }
        .header-btns { display: flex; gap: 15px; }
        .header-btn { font-size: 20px; cursor: pointer; opacity: 0.8; }
        
        /* 主内容区 */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 功能导航 */
        .feature-nav {
            display: flex;
            overflow-x: auto;
            padding: 10px;
            gap: 8px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
        }
        .feature-nav::-webkit-scrollbar { display: none; }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 16px;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 70px;
        }
        .nav-item:hover, .nav-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
        }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }
        .nav-label { font-size: 12px; white-space: nowrap; }
        
        /* 内容区 */
        .content { flex: 1; overflow-y: auto; padding: 15px; }
        .tab { display: none; }
        .tab.active { display: block; }
        
        /* 对话区 */
        .chat-area { min-height: 300px; }
        .message { margin-bottom: 15px; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.bot { display: flex; gap: 10px; }
        .bot-avatar {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }
        .bot-content { flex: 1; }
        .bot-name { font-size: 11px; color: #999; margin-bottom: 4px; }
        .bot-text {
            background: #f8f9fa;
            padding: 10px 14px;
            border-radius: 14px 14px 14px 4px;
            font-size: 14px; line-height: 1.5; color: #333;
        }
        .message.user { display: flex; justify-content: flex-end; }
        .user-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 14px;
            border-radius: 14px 14px 4px 14px;
            font-size: 14px; line-height: 1.5;
            max-width: 80%;
        }
        
        /* 熊猫形象 */
        .panda-face {
            width: 160px; height: 160px;
            background: white;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin: 40px auto 20px;
        }
        .panda-ear {
            width: 40px; height: 40px;
            background: #1a1a1a;
            border-radius: 50%;
            position: absolute;
            top: -8px;
        }
        .panda-ear.left { left: 8px; }
        .panda-ear.right { right: 8px; }
        .panda-eye-patch {
            width: 45px; height: 50px;
            background: #1a1a1a;
            border-radius: 50%;
            position: absolute;
            top: 40px;
        }
        .panda-eye-patch.left { left: 15px; transform: rotate(5deg); }
        .panda-eye-patch.right { right: 15px; transform: rotate(-5deg); }
        .panda-eye {
            width: 20px; height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 55px;
        }
        .panda-eye.left { left: 25px; }
        .panda-eye.right { right: 25px; }
        .panda-pupil {
            width: 10px; height: 10px;
            background: #1a1a1a;
            border-radius: 50%;
            position: absolute;
            top: 60px;
        }
        .panda-pupil.left { left: 30px; }
        .panda-pupil.right { right: 30px; }
        .panda-nose {
            width: 20px; height: 12px;
            background: #1a1a1a;
            border-radius: 50%;
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
        }
        .panda-mouth {
            width: 30px; height: 15px;
            border: 3px solid #1a1a1a;
            border-top: none;
            border-radius: 0 0 50% 50%;
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* 动画 */
        .panda-face.speaking {
            animation: pandaSpeak 0.3s ease-in-out infinite;
        }
        @keyframes pandaSpeak {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* 通话状态 */
        .call-status {
            text-align: center;
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }
        .call-hint {
            text-align: center;
            font-size: 13px;
            color: #999;
        }
        
        /* 音色选择 */
        .voice-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
            padding: 0 10px;
        }
        .voice-btn {
            background: #f8f9fa;
            border: 2px solid transparent;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .voice-btn:hover { background: #e9ecef; }
        .voice-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        /* 通话按钮 */
        .call-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .call-btn {
            width: 64px; height: 64px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .call-btn.start {
            background: #4CAF50;
            color: white;
            animation: pulse 2s ease-in-out infinite;
        }
        .call-btn.end {
            background: #f44336;
            color: white;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* 文件上传 */
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }
        .upload-icon { font-size: 48px; margin-bottom: 10px; }
        .upload-text { font-size: 16px; color: #333; margin-bottom: 5px; }
        .upload-hint { font-size: 12px; color: #999; }
        
        /* 图像预览 */
        .image-preview {
            margin: 20px 0;
            text-align: center;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
        }
        
        /* 智能体卡片 */
        .agent-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .agent-card:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
        }
        
        /* 输入区 */
        .input-area {
            padding: 10px;
            background: white;
            border-top: 1px solid #f0f0f0;
        }
        .input-tools {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .tool-btn {
            flex: 1;
            padding: 8px;
            background: #f8f9fa;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tool-btn:hover { background: #e9ecef; }
        .tool-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .input-wrapper {
            display: flex;
            gap: 8px;
        }
        .input-box {
            flex: 1;
            position: relative;
        }
        .input-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #f0f0f0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }
        .input-box input:focus { border-color: #667eea; }
        .send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        
        /* 统计信息 */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 11px;
            color: #999;
        }
        
        /* 记忆列表 */
        .memory-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .memory-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 头部 -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🐼</span>
                <span class="title">TOKI</span>
                <span class="version">V4.0</span>
            </div>
            <div class="header-btns">
                <span class="header-btn" onclick="openSettings()">⚙️</span>
            </div>
        </header>
        
        <!-- 功能导航 -->
        <nav class="feature-nav">
            <div class="nav-item active" onclick="switchFeature('chat')">
                <span class="nav-icon">💬</span>
                <span class="nav-label">对话</span>
            </div>
            <div class="nav-item" onclick="switchFeature('voice')">
                <span class="nav-icon">🎤</span>
                <span class="nav-label">语音</span>
            </div>
            <div class="nav-item" onclick="switchFeature('file')">
                <span class="nav-icon">📸</span>
                <span class="nav-label">识别</span>
            </div>
            <div class="nav-item" onclick="switchFeature('agent')">
                <span class="nav-icon">🤖</span>
                <span class="nav-label">智能体</span>
            </div>
            <div class="nav-item" onclick="switchFeature('memory')">
                <span class="nav-icon">🧠</span>
                <span class="nav-label">记忆</span>
            </div>
        </nav>
        
        <!-- 主内容区 -->
        <main class="main">
            <div class="content">
                <!-- 对话Tab -->
                <div class="tab active" id="chatTab">
                    <div class="chat-area" id="chatArea">
                        <div class="message bot">
                            <div class="bot-avatar">🐼</div>
                            <div class="bot-content">
                                <div class="bot-name">TOKI</div>
                                <div class="bot-text">
                                    🎉 TOKI V4.0 完整版已加载！<br><br>
                                    💬 <strong>智能对话</strong> - 和熊猫聊天<br>
                                    🎤 <strong>语音通话</strong> - 百度语音合成（6种音色）<br>
                                    📸 <strong>图像识别</strong> - GLM-4V-Flash<br>
                                    🤖 <strong>智能体</strong> - 4个专业助手<br>
                                    🧠 <strong>记忆系统</strong> - 记住你的偏好<br><br>
                                    试试说"你好"或上传图片识别！
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 语音Tab -->
                <div class="tab" id="voiceTab">
                    <div class="panda-face" id="pandaFace">
                        <div class="panda-ear left"></div>
                        <div class="panda-ear right"></div>
                        <div class="panda-eye-patch left"></div>
                        <div class="panda-eye-patch right"></div>
                        <div class="panda-eye left"></div>
                        <div class="panda-eye right"></div>
                        <div class="panda-pupil left"></div>
                        <div class="panda-pupil right"></div>
                        <div class="panda-nose"></div>
                        <div class="panda-mouth"></div>
                    </div>
                    <div class="call-status" id="voiceStatus">选择音色，点击绿色按钮开始</div>
                    
                    <!-- 音色选择 -->
                    <div class="voice-selector">
                        <button class="voice-btn active" onclick="selectVoice(0, this)">👧 小美</button>
                        <button class="voice-btn" onclick="selectVoice(1, this)">👦 小宇</button>
                        <button class="voice-btn" onclick="selectVoice(3, this)">😄 逍遥</button>
                        <button class="voice-btn" onclick="selectVoice(4, this)">👧 丫丫</button>
                        <button class="voice-btn" onclick="selectVoice(103, this)">🤖 度米朵</button>
                    </div>
                    
                    <!-- 通话控制 -->
                    <div class="call-controls">
                        <button class="call-btn start" id="startBtn" onclick="startVoiceCall()">📞</button>
                        <button class="call-btn end" id="endBtn" onclick="endVoiceCall()" style="display:none;">📞</button>
                    </div>
                    <div class="call-hint">使用百度语音合成 · 每日500次免费</div>
                </div>
                
                <!-- 文件Tab -->
                <div class="tab" id="fileTab">
                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">点击上传图片</div>
                        <div class="upload-hint">支持 JPG/PNG · GLM-4V-Flash 识别</div>
                    </div>
                    <input type="file" id="fileInput" style="display:none" accept="image/*" onchange="handleFileUpload(event)">
                    <div id="imagePreview" class="image-preview"></div>
                    <button id="analyzeBtn" onclick="analyzeImage()" style="display:none;width:100%;padding:12px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;">
                        🔍 开始识别
                    </button>
                </div>
                
                <!-- 智能体Tab -->
                <div class="tab" id="agentTab">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="agent-card" onclick="selectAgent('analyst')">
                            <div style="font-size: 32px; margin-bottom: 8px;">📊</div>
                            <div style="font-size: 13px; font-weight: 500;">数据分析师</div>
                        </div>
                        <div class="agent-card" onclick="selectAgent('business')">
                            <div style="font-size: 32px; margin-bottom: 8px;">💼</div>
                            <div style="font-size: 13px; font-weight: 500;">商务助手</div>
                        </div>
                        <div class="agent-card" onclick="selectAgent('tutor')">
                            <div style="font-size: 32px; margin-bottom: 8px;">📚</div>
                            <div style="font-size: 13px; font-weight: 500;">学习导师</div>
                        </div>
                        <div class="agent-card" onclick="selectAgent('coder')">
                            <div style="font-size: 32px; margin-bottom: 8px;">💻</div>
                            <div style="font-size: 13px; font-weight: 500;">编程助手</div>
                        </div>
                    </div>
                </div>
                
                <!-- 记忆Tab -->
                <div class="tab" id="memoryTab">
                    <div class="stats-bar">
                        <div class="stat-item">
                            <div class="stat-value" id="totalMem">0</div>
                            <div class="stat-label">总记忆</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalCalls">0</div>
                            <div class="stat-label">通话次数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalImages">0</div>
                            <div class="stat-label">识别图片</div>
                        </div>
                    </div>
                    <div class="memory-list" id="memoryList"></div>
                </div>
            </div>
            
            <!-- 输入区 -->
            <div class="input-area">
                <div class="input-tools">
                    <button class="tool-btn" onclick="switchFeature('voice')">🎤 语音</button>
                    <button class="tool-btn" onclick="document.getElementById('fileInput').click()">📸 图片</button>
                    <button class="tool-btn" onclick="switchFeature('agent')">🤖 助手</button>
                </div>
                <div class="input-wrapper">
                    <div class="input-box">
                        <input type="text" id="inputText" placeholder="输入消息..." onkeydown="handleKeydown(event)">
                    </div>
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // ============ API配置 ============
        const ZHIPU_API_KEY = 'c4911cf15f844167bd26301e25622cf1.n1BU10ytXbnQ6N5d';
        const ZHIPU_BASE_URL = 'https://open.bigmodel.cn/api/paas/v4';
        
        const BAIDU_API_KEY = 'KzPJnG6YSZXZKM1ic9KsrAGi';
        const BAIDU_SECRET_KEY = 'JGACwssuiimzcyJOJD9JNaIacYZchdze';
        
        // ============ 状态管理 ============
        const state = {
            messages: [],
            currentAgent: null,
            currentVoice: 0,
            isCallActive: false,
            uploadedImageUrl: null,
            callHistory: [],
            imageHistory: []
        };
        
        let recognition = null;
        let baiduToken = null;
        let audioPlayer = new Audio();
        
        // ============ 百度语音API ============
        async function getBaiduToken() {
            if (baiduToken) return baiduToken;
            
            try {
                const res = await fetch(`https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${BAIDU_API_KEY}&client_secret=${BAIDU_SECRET_KEY}`, {
                    method: 'POST'
                });
                const data = await res.json();
                baiduToken = data.access_token;
                console.log('✅ 百度Token获取成功');
                return baiduToken;
            } catch (e) {
                console.error('❌ 百度Token失败:', e);
                return null;
            }
        }
        
        async function speak(text) {
            const token = await getBaiduToken();
            if (!token) {
                alert('语音服务不可用');
                return;
            }
            
            const url = `https://tsn.baidu.com/text2audio?tex=${encodeURIComponent(text)}&tok=${token}&cuid=toki_v4&ctp=1&lan=zh&spd=5&pit=5&vol=9&per=${state.currentVoice}&aue=6`;
            
            document.getElementById('pandaFace').classList.add('speaking');
            updateVoiceStatus('正在说话...');
            
            audioPlayer.src = url;
            audioPlayer.onended = () => {
                document.getElementById('pandaFace').classList.remove('speaking');
                updateVoiceStatus('正在聆听...');
                
                if (state.isCallActive && recognition) {
                    try { recognition.start(); } catch(e) {}
                }
            };
            audioPlayer.onerror = () => {
                document.getElementById('pandaFace').classList.remove('speaking');
                updateVoiceStatus('播放失败');
            };
            
            try {
                await audioPlayer.play();
            } catch (e) {
                console.error('播放失败:', e);
            }
        }
        
        // ============ 语音识别 ============
        function initRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('浏览器不支持语音识别，请使用Chrome');
                return false;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;
            recognition.interimResults = false;
            
            recognition.onresult = async (event) => {
                const text = event.results[event.results.length - 1][0].transcript;
                console.log('🎤 识别到:', text);
                await processVoiceInput(text);
            };
            
            recognition.onerror = (e) => {
                console.error('识别错误:', e.error);
                if (e.error === 'not-allowed') {
                    alert('请在浏览器设置中允许麦克风权限');
                }
            };
            
            recognition.onend = () => {
                if (state.isCallActive) {
                    setTimeout(() => {
                        if (state.isCallActive && recognition) {
                            try { recognition.start(); } catch(e) {}
                        }
                    }, 500);
                }
            };
            
            return true;
        }
        
        async function processVoiceInput(text) {
            updateVoiceStatus('思考中...');
            
            try {
                const res = await fetch(`${ZHIPU_BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ZHIPU_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'glm-4-flash',
                        messages: [
                            { role: 'system', content: '你是TOKI，来自四川的熊猫AI助手。正在语音通话中，请用口语化、友好的方式回答，控制20字以内。' },
                            { role: 'user', content: text }
                        ]
                    })
                });
                
                const data = await res.json();
                const reply = data.choices[0].message.content;
                
                await speak(reply);
            } catch (e) {
                console.error('API错误:', e);
                await speak('抱歉，出了点问题');
            }
        }
        
        // ============ 图像识别 ============
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                state.uploadedImageUrl = e.target.result;
                
                document.getElementById('imagePreview').innerHTML = `<img src="${state.uploadedImageUrl}">`;
                document.getElementById('analyzeBtn').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
        
        async function analyzeImage() {
            if (!state.uploadedImageUrl) {
                alert('请先上传图片');
                return;
            }
            
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = `<img src="${state.uploadedImageUrl}"><div style="text-align:center;margin-top:10px;color:#666;">🔍 正在识别...</div>`;
            
            try {
                const res = await fetch(`${ZHIPU_BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ZHIPU_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'glm-4v-flash',
                        messages: [{
                            role: 'user',
                            content: [
                                { type: 'text', text: '请详细描述这张图片的内容：1.主要物体和场景 2.颜色和构图 3.可能的故事。用中文回答。' },
                                { type: 'image_url', image_url: { url: state.uploadedImageUrl } }
                            ]
                        }],
                        max_tokens: 1024
                    })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    const result = data.choices[0].message.content;
                    preview.innerHTML = `
                        <img src="${state.uploadedImageUrl}">
                        <div style="text-align:left;margin-top:15px;padding:15px;background:#f8f9fa;border-radius:8px;font-size:14px;line-height:1.6;white-space:pre-wrap;">
${result}
                        </div>
                    `;
                    
                    // 记录
                    state.imageHistory.push({ timestamp: Date.now() });
                    updateMemoryStats();
                } else {
                    preview.innerHTML = `<img src="${state.uploadedImageUrl}"><div style="color:#f44336;margin-top:10px;">❌ 识别失败: ${data.error?.message || '未知错误'}</div>`;
                }
            } catch (e) {
                console.error('错误:', e);
                preview.innerHTML = `<img src="${state.uploadedImageUrl}"><div style="color:#f44336;margin-top:10px;">❌ 网络错误</div>`;
            }
        }
        
        // ============ 消息处理 ============
        async function sendMessage() {
            const input = document.getElementById('inputText');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage('user', text);
            input.value = '';
            
            // 显示加载
            const loadingMsg = addMessage('bot', '思考中...');
            
            try {
                const res = await fetch(`${ZHIPU_BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ZHIPU_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: state.currentAgent ? 'glm-4-flash' : 'glm-4-flash',
                        messages: buildMessages(text)
                    })
                });
                
                const data = await res.json();
                loadingMsg.remove();
                
                if (res.ok) {
                    const reply = data.choices[0].message.content;
                    addMessage('bot', reply);
                    state.messages.push({ role: 'user', content: text });
                    state.messages.push({ role: 'assistant', content: reply });
                } else {
                    addMessage('bot', '抱歉，出错了: ' + (data.error?.message || '未知错误'));
                }
            } catch (e) {
                loadingMsg.remove();
                addMessage('bot', '网络错误，请重试');
            }
        }
        
        function buildMessages(text) {
            const messages = [];
            
            // 系统提示
            const systemPrompts = {
                'analyst': '你是数据分析专家，擅长数据可视化、趋势分析和洞察提炼。',
                'business': '你是商务助手，擅长商业文档、报告撰写和会议纪要。',
                'tutor': '你是学习导师，擅长用通俗易懂的方式解释复杂概念。',
                'coder': '你是编程助手，擅长多种编程语言和技术问题解决。'
            };
            
            if (state.currentAgent && systemPrompts[state.currentAgent]) {
                messages.push({ role: 'system', content: systemPrompts[state.currentAgent] });
            } else {
                messages.push({ role: 'system', content: '你是TOKI，来自四川的熊猫AI助手。友好、专业、乐于助人。' });
            }
            
            // 对话历史
            messages.push(...state.messages.slice(-10));
            
            // 当前消息
            messages.push({ role: 'user', content: text });
            
            return messages;
        }
        
        function addMessage(type, text) {
            const chatArea = document.getElementById('chatArea');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            
            if (type === 'user') {
                msg.innerHTML = `<div class="user-text">${text}</div>`;
            } else {
                msg.innerHTML = `
                    <div class="bot-avatar">🐼</div>
                    <div class="bot-content">
                        <div class="bot-name">TOKI</div>
                        <div class="bot-text">${text.replace(/\n/g, '<br>')}</div>
                    </div>
                `;
            }
            
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
            return msg;
        }
        
        function handleKeydown(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
        
        // ============ 功能切换 ============
        function switchFeature(feature) {
            document.querySelectorAll('.feature-nav .nav-item').forEach((item, index) => {
                item.classList.remove('active');
                if (index === ['chat', 'voice', 'file', 'agent', 'memory'].indexOf(feature)) {
                    item.classList.add('active');
                }
            });
            
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(feature + 'Tab').classList.add('active');
        }
        
        // ============ 语音控制 ============
        function selectVoice(voice, btn) {
            state.currentVoice = voice;
            document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // 试听
            speak('你好，我是TOKI');
        }
        
        function updateVoiceStatus(text) {
            document.getElementById('voiceStatus').textContent = text;
        }
        
        function startVoiceCall() {
            if (!initRecognition()) return;
            
            state.isCallActive = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('endBtn').style.display = 'block';
            
            try {
                recognition.start();
                updateVoiceStatus('正在聆听...');
            } catch (e) {
                console.error('启动失败:', e);
            }
            
            setTimeout(() => {
                speak('你好！我是TOKI，有什么可以帮你的吗？');
            }, 1000);
            
            state.callHistory.push({ startTime: Date.now() });
            updateMemoryStats();
        }
        
        function endVoiceCall() {
            state.isCallActive = false;
            
            if (recognition) try { recognition.stop(); } catch(e) {}
            if (audioPlayer) audioPlayer.pause();
            
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('endBtn').style.display = 'none';
            document.getElementById('pandaFace').classList.remove('speaking');
            
            updateVoiceStatus('通话已结束');
        }
        
        // ============ 智能体 ============
        function selectAgent(agent) {
            state.currentAgent = agent;
            const names = {
                'analyst': '数据分析师',
                'business': '商务助手',
                'tutor': '学习导师',
                'coder': '编程助手'
            };
            
            switchFeature('chat');
            state.messages = [];
            addMessage('bot', `已切换到 ${names[agent]} 模式，有什么可以帮你？`);
        }
        
        // ============ 记忆统计 ============
        function updateMemoryStats() {
            document.getElementById('totalMem').textContent = state.messages.length;
            document.getElementById('totalCalls').textContent = state.callHistory.length;
            document.getElementById('totalImages').textContent = state.imageHistory.length;
        }
        
        // ============ 设置 ============
        function openSettings() {
            alert('设置功能开发中...');
        }
        
        // ============ 初始化 ============
        console.log('🐼 TOKI V4.0 Enhanced 已加载');
        console.log('🎤 百度语音合成 · 📸 GLM-4V-Flash · 🧠 智能记忆');
        
        // 预加载百度Token
        getBaiduToken();
    </script>
</body>
</html>
