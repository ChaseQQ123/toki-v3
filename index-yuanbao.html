<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>TOKI - AI助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #FFFFFF;
            height: 100vh;
            height: 100dvh; /* 动态视口高度，适配iOS Safari */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* 主容器 - 全屏对话 */
        .app {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            position: relative;
        }
        
        /* 对话区域 - 占满全屏 */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 100px; /* 底部留出输入框空间 */
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        
        /* 欢迎页面 */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 20px;
            text-align: center;
        }
        
        .welcome-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }
        
        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        
        .welcome-desc {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        
        /* 快捷问题按钮 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }
        
        .quick-btn {
            padding: 16px;
            background: #f7f7f7;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.4;
            text-align: left;
        }
        
        .quick-btn:active {
            background: #e8e8e8;
            transform: scale(0.98);
        }
        
        /* 消息气泡 */
        .msg {
            margin-bottom: 16px;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .msg-user {
            display: flex;
            justify-content: flex-end;
        }
        
        .msg-bot {
            display: flex;
            gap: 10px;
        }
        
        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .msg-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 16px;
            word-wrap: break-word;
        }
        
        .msg-user .msg-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }
        
        .msg-bot .msg-bubble {
            background: #f7f7f7;
            color: #1a1a1a;
            border-bottom-left-radius: 6px;
        }
        
        .msg-bubble img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
        }
        
        /* Markdown样式 */
        .msg-bubble code {
            background: rgba(0,0,0,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .msg-bubble pre {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        
        .msg-bubble pre code {
            background: none;
            padding: 0;
        }
        
        /* 底部输入区 - 固定 */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #f0f0f0;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); /* 适配iPhone底部 */
        }
        
        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: #f7f7f7;
            border-radius: 24px;
            padding: 8px 16px;
        }
        
        #input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            max-height: 100px;
            outline: none;
            font-family: inherit;
        }
        
        #input::placeholder {
            color: #999;
        }
        
        .mic-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .mic-btn:active {
            transform: scale(0.9);
        }
        
        .mic-btn.recording {
            background: #F44336;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* 加载动画 */
        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        
        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }
        
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        /* 右上角菜单按钮 */
        .menu-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 侧边栏 */
        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1);
            z-index: 200;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .sidebar-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .sidebar-subtitle {
            font-size: 14px;
            color: #999;
        }
        
        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .menu-item:active {
            background: #f7f7f7;
        }
        
        .menu-icon {
            font-size: 20px;
        }
        
        .menu-label {
            font-size: 16px;
            color: #333;
        }
        
        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* 打字效果 */
        .typing-text {
            border-right: 2px solid #667eea;
            animation: blink 0.8s infinite;
        }
        
        @keyframes blink {
            0%, 100% { border-color: #667eea; }
            50% { border-color: transparent; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 对话区域 -->
        <main class="chat" id="chat">
            <!-- 欢迎页面 -->
            <div class="welcome" id="welcome">
                <div class="welcome-avatar">🤖</div>
                <h1 class="welcome-title">你好，我是TOKI</h1>
                <p class="welcome-desc">
                    我是你的AI助手<br>
                    可以回答问题、画画、聊天
                </p>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="quickAsk('介绍一下你自己')">介绍一下你自己</button>
                    <button class="quick-btn" onclick="quickAsk('画一只可爱的猫咪')">画一只可爱的猫咪 🎨</button>
                    <button class="quick-btn" onclick="quickAsk('今天有什么新闻')">今天有什么新闻</button>
                    <button class="quick-btn" onclick="quickAsk('写一首关于春天的诗')">写一首关于春天的诗</button>
                </div>
            </div>
        </main>
        
        <!-- 底部输入区 -->
        <div class="input-area">
            <div class="input-box">
                <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="handleKey(event)"></textarea>
                <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
            </div>
        </div>
        
        <!-- 菜单按钮 -->
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">功能菜单</div>
                <div class="sidebar-subtitle">更多功能等你探索</div>
            </div>
            <nav class="sidebar-menu">
                <div class="menu-item" onclick="clearChat()">
                    <span class="menu-icon">🗑️</span>
                    <span class="menu-label">清除对话</span>
                </div>
                <div class="menu-item" onclick="showMemory()">
                    <span class="menu-icon">🧠</span>
                    <span class="menu-label">记忆系统</span>
                </div>
                <div class="menu-item" onclick="showAbout()">
                    <span class="menu-icon">ℹ️</span>
                    <span class="menu-label">关于TOKI</span>
                </div>
            </nav>
        </aside>
        
        <!-- 遮罩 -->
        <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    </div>
    
    <script>
        // API配置
        const BASE_URL = 'https://open.bigmodel.cn/api/paas/v4';
        const API_KEY = '9cae1ef67a4c4f31b30bb1f0b32f39e2.bO8PqKcVnJmVbNgm';
        
        // 状态
        let isRecording = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let history = [];
        let autoSpeak = false; // 自动播报开关
        
        // 初始化语音识别
        function initSpeech() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'zh-CN';
                
                recognition.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    document.getElementById('input').value = text;
                    stopMic();
                    send(); // 自动发送
                };
                
                recognition.onerror = (e) => {
                    console.error('语音识别错误:', e.error);
                    stopMic();
                };
                
                recognition.onend = () => {
                    stopMic();
                };
            }
        }
        
        // 切换麦克风
        function toggleMic() {
            if (isRecording) {
                stopMic();
            } else {
                startMic();
            }
        }
        
        function startMic() {
            if (recognition) {
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                recognition.start();
            } else {
                alert('您的浏览器不支持语音识别');
            }
        }
        
        function stopMic() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            if (recognition) recognition.stop();
        }
        
        // 语音播报
        function speak(text) {
            if (synthesis) {
                synthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g, ''));
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                synthesis.speak(utterance);
            }
        }
        
        // 快捷提问
        function quickAsk(text) {
            document.getElementById('input').value = text;
            send();
        }
        
        // 发送消息
        async function send() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;
            
            // 隐藏欢迎页
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.style.display = 'none';
            
            // 添加用户消息
            addMsg(text, 'user');
            input.value = '';
            
            // 显示加载
            const loadingId = showLoading();
            
            try {
                const reply = await callAPI(text);
                removeLoading(loadingId);
                
                // 添加机器人消息（带打字效果）
                await addMsgWithTyping(reply, 'bot');
                
                // 自动播报
                if (autoSpeak) {
                    speak(reply);
                }
                
            } catch (err) {
                removeLoading(loadingId);
                addMsg('抱歉，我遇到了一些问题，请稍后再试。', 'bot');
            }
            
            scrollDown();
        }
        
        // 添加消息
        function addMsg(content, type) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg msg-${type}`;
            
            if (type === 'user') {
                div.innerHTML = `<div class="msg-bubble">${content}</div>`;
            } else {
                div.innerHTML = `
                    <div class="msg-avatar">🤖</div>
                    <div class="msg-bubble">${formatMarkdown(content)}</div>
                `;
            }
            
            chat.appendChild(div);
            
            // 保存历史
            history.push({ role: type, content });
        }
        
        // 带打字效果的消息
        async function addMsgWithTyping(content, type) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg msg-${type}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            
            div.innerHTML = `<div class="msg-avatar">🤖</div>`;
            div.appendChild(bubble);
            chat.appendChild(div);
            
            // 打字效果
            let index = 0;
            const formatted = formatMarkdown(content);
            const plainText = content.replace(/<[^>]*>/g, '');
            
            return new Promise((resolve) => {
                const timer = setInterval(() => {
                    if (index < plainText.length) {
                        bubble.textContent = plainText.substring(0, index + 1);
                        index++;
                        scrollDown();
                    } else {
                        clearInterval(timer);
                        bubble.innerHTML = formatted;
                        history.push({ role: type, content });
                        resolve();
                    }
                }, 30); // 30ms一个字
            });
        }
        
        // 格式化Markdown
        function formatMarkdown(text) {
            return text
                .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }
        
        // 显示加载
        function showLoading() {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            const id = 'loading-' + Date.now();
            div.id = id;
            div.className = 'msg msg-bot';
            div.innerHTML = `
                <div class="msg-avatar">🤖</div>
                <div class="msg-bubble">
                    <div class="typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chat.appendChild(div);
            return id;
        }
        
        // 移除加载
        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        
        // 调用API
        async function callAPI(msg) {
            // 判断是否是图像生成
            if (msg.includes('画') || msg.includes('生成图')) {
                const res = await fetch(`${BASE_URL}/images/generations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'cogview-3-flash',
                        prompt: msg
                    })
                });
                
                const data = await res.json();
                return `<img src="${data.data[0].url}" alt="生成的图片">`;
            }
            
            // 对话
            const messages = history.slice(-10).map(h => ({
                role: h.role === 'user' ? 'user' : 'assistant',
                content: h.content.replace(/<[^>]*>/g, '')
            }));
            messages.push({ role: 'user', content: msg });
            
            const res = await fetch(`${BASE_URL}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'glm-4-flash',
                    messages
                })
            });
            
            const data = await res.json();
            return data.choices[0].message.content;
        }
        
        // 滚动到底部
        function scrollDown() {
            const chat = document.getElementById('chat');
            chat.scrollTop = chat.scrollHeight;
        }
        
        // 处理回车键
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        }
        
        // 侧边栏
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        // 清除对话
        function clearChat() {
            closeSidebar();
            const chat = document.getElementById('chat');
            chat.innerHTML = `
                <div class="welcome" id="welcome">
                    <div class="welcome-avatar">🤖</div>
                    <h1 class="welcome-title">你好，我是TOKI</h1>
                    <p class="welcome-desc">
                        我是你的AI助手<br>
                        可以回答问题、画画、聊天
                    </p>
                    <div class="quick-actions">
                        <button class="quick-btn" onclick="quickAsk('介绍一下你自己')">介绍一下你自己</button>
                        <button class="quick-btn" onclick="quickAsk('画一只可爱的猫咪')">画一只可爱的猫咪 🎨</button>
                        <button class="quick-btn" onclick="quickAsk('今天有什么新闻')">今天有什么新闻</button>
                        <button class="quick-btn" onclick="quickAsk('写一首关于春天的诗')">写一首关于春天的诗</button>
                    </div>
                </div>
            `;
            history = [];
        }
        
        // 显示记忆
        function showMemory() {
            closeSidebar();
            alert('记忆系统开发中...');
        }
        
        // 显示关于
        function showAbout() {
            closeSidebar();
            alert('TOKI V3.1\n\n一款极简AI助手\n\n功能：\n- 智能对话\n- 图像生成\n- 语音输入');
        }
        
        // 初始化
        window.onload = () => {
            initSpeech();
        };
    </script>
</body>
</html>
