<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKI - 超级AI助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 头部 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 功能导航 */
        .feature-nav {
            display: flex;
            overflow-x: auto;
            padding: 10px;
            background: #f8f9fa;
            gap: 8px;
        }
        
        .feature-nav::-webkit-scrollbar {
            display: none;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 70px;
        }
        
        .nav-item:hover,
        .nav-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .nav-icon {
            font-size: 24px;
        }
        
        .nav-label {
            font-size: 12px;
            margin-top: 4px;
        }
        
        /* 内容区域 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 智能体卡片 */
        .agent-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .agent-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        
        .agent-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .agent-icon {
            font-size: 32px;
        }
        
        .agent-name {
            font-size: 16px;
            font-weight: 600;
        }
        
        .agent-desc {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .agent-examples {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .example-tag {
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #667eea;
        }
        
        /* 工具卡片 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        
        .tool-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tool-item:hover {
            border-color: #667eea;
        }
        
        .tool-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .tool-name {
            font-size: 12px;
            font-weight: 500;
        }
        
        /* 文件上传 */
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .upload-text {
            font-size: 14px;
            color: #666;
        }
        
        .upload-hint {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
        
        /* 搜索框 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .search-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        /* 对话区域 */
        .chat-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            padding: 12px;
            border-radius: 12px;
            max-width: 80%;
        }
        
        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }
        
        .message.bot {
            background: #f8f9fa;
            color: #333;
        }
        
        /* 输入区域 */
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 24px;
            outline: none;
        }
        
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .modal-body input,
        .modal-body textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .modal-body textarea {
            min-height: 100px;
        }
        
        .modal-footer button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <span style="font-size:24px">🤖</span>
                <span style="font-size:20px;font-weight:bold">TOKI</span>
                <span style="font-size:10px;background:rgba(255,255,255,0.2);padding:2px 6px;border-radius:8px">V3.0</span>
            </div>
            <div>💎 10,000</div>
        </header>
        
        <!-- 功能导航 -->
        <nav class="feature-nav">
            <div class="nav-item active" onclick="switchTab('chat')">
                <span class="nav-icon">💬</span>
                <span class="nav-label">对话</span>
            </div>
            <div class="nav-item" onclick="switchTab('agents')">
                <span class="nav-icon">🤖</span>
                <span class="nav-label">智能体</span>
            </div>
            <div class="nav-item" onclick="switchTab('tools')">
                <span class="nav-icon">🛠️</span>
                <span class="nav-label">工具</span>
            </div>
            <div class="nav-item" onclick="switchTab('files')">
                <span class="nav-icon">📤</span>
                <span class="nav-label">文件</span>
            </div>
            <div class="nav-item" onclick="switchTab('search')">
                <span class="nav-icon">🔍</span>
                <span class="nav-label">搜索</span>
            </div>
        </nav>
        
        <!-- 内容区域 -->
        <main class="content">
            <!-- 对话标签页 -->
            <div id="chatTab" class="tab-content active">
                <div class="chat-area" id="chatArea">
                    <div class="message bot">
                        你好！我是TOKI 3.0，集成了Kimi和智谱清言的强大功能！ ✨<br><br>
                        我现在支持：<br>
                        🤖 智能体对话（6个专业助手）<br>
                        📤 文件上传解析（PDF、Word、Excel）<br>
                        🔍 网络搜索<br>
                        🛠️ 丰富工具箱<br><br>
                        有什么我可以帮你的吗？
                    </div>
                </div>
            </div>
            
            <!-- 智能体标签页 -->
            <div id="agentsTab" class="tab-content">
                <div id="agentsList"></div>
            </div>
            
            <!-- 工具标签页 -->
            <div id="toolsTab" class="tab-content">
                <div class="tools-grid" id="toolsGrid"></div>
            </div>
            
            <!-- 文件标签页 -->
            <div id="filesTab" class="tab-content">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击或拖拽文件到此处</div>
                    <div class="upload-hint">支持 PDF、Word、Excel、图片</div>
                </div>
                <input type="file" id="fileInput" style="display:none" onchange="handleFileUpload(event)">
                <div id="fileList" style="margin-top:20px"></div>
            </div>
            
            <!-- 搜索标签页 -->
            <div id="searchTab" class="tab-content">
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="输入搜索关键词...">
                    <button class="search-btn" onclick="performSearch()">🔍 搜索</button>
                </div>
                <div id="searchResults"></div>
            </div>
        </main>
        
        <!-- 输入区域 -->
        <footer class="input-area">
            <input type="text" id="userInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">发送</button>
        </footer>
    </div>
    
    <!-- 工具模态框 -->
    <div class="modal" id="toolModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="toolTitle">工具</h3>
                <span style="cursor:pointer;font-size:24px" onclick="closeModal()">×</span>
            </div>
            <div class="modal-body" id="toolBody"></div>
            <div class="modal-footer">
                <button onclick="executeTool()">执行</button>
            </div>
        </div>
    </div>
    
    <!-- 引入工具库 -->
    <script src="toki-tools.js"></script>
    
    <script>
        // 初始化
        const tools = new TOKITools();
        const agents = new TOKIAgents();
        const fileHandler = new TOKIFileHandler();
        
        const apiKey = 'c4911cf15f844167bd26301e25622cf1.n1BU10ytXbnQ6N5d';
        const baseUrl = 'https://open.bigmodel.cn/api/paas/v4';
        
        let currentTool = null;
        
        // 初始化界面
        function init() {
            renderAgents();
            renderTools();
        }
        
        // 渲染智能体列表
        function renderAgents() {
            const agentList = agents.getAgentList();
            const container = document.getElementById('agentsList');
            
            container.innerHTML = agentList.map(agent => `
                <div class="agent-card" onclick="selectAgent('${agent.id}')">
                    <div class="agent-header">
                        <span class="agent-icon">${agent.name.split(' ')[0]}</span>
                        <span class="agent-name">${agent.name.split(' ').slice(1).join(' ')}</span>
                    </div>
                    <div class="agent-desc">${agent.description}</div>
                    <div class="agent-examples">
                        ${agent.examples.map(ex => `<span class="example-tag">${ex}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        
        // 渲染工具列表
        function renderTools() {
            const container = document.getElementById('toolsGrid');
            
            container.innerHTML = Object.entries(tools.tools).map(([id, tool]) => `
                <div class="tool-item" onclick="openTool('${id}')">
                    <div class="tool-icon">${tool.icon}</div>
                    <div class="tool-name">${tool.name}</div>
                </div>
            `).join('');
        }
        
        // 切换标签页
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId + 'Tab').classList.add('active');
            event.currentTarget.classList.add('active');
        }
        
        // 选择智能体
        function selectAgent(agentId) {
            const agent = agents.agents[agentId];
            
            switchTab('chat');
            addMessage(`已启动 ${agent.name}`, 'bot');
            
            // 保存当前智能体
            window.currentAgent = agentId;
        }
        
        // 打开工具
        function openTool(toolId) {
            const tool = tools.tools[toolId];
            currentTool = toolId;
            
            document.getElementById('toolTitle').textContent = tool.name;
            
            let bodyHtml = '';
            
            if (toolId === 'calculator') {
                bodyHtml = '<input type="text" id="toolInput" placeholder="输入数学表达式，如：2+2*5">';
            } else if (toolId === 'weather') {
                bodyHtml = '<input type="text" id="toolInput" placeholder="输入城市名，如：北京">';
            } else if (toolId === 'search') {
                bodyHtml = '<input type="text" id="toolInput" placeholder="输入搜索关键词">';
            } else if (toolId === 'translate') {
                bodyHtml = '<textarea id="toolInput" placeholder="输入要翻译的内容"></textarea>';
            }
            
            document.getElementById('toolBody').innerHTML = bodyHtml;
            document.getElementById('toolModal').classList.add('active');
        }
        
        // 执行工具
        async function executeTool() {
            const input = document.getElementById('toolInput').value;
            
            if (!input) {
                alert('请输入内容');
                return;
            }
            
            const result = await tools.executeTool(currentTool, input);
            
            if (result.success) {
                closeModal();
                switchTab('chat');
                
                let resultText = '';
                
                if (currentTool === 'calculator') {
                    resultText = `计算结果：${input} = ${result.result}`;
                } else if (currentTool === 'weather') {
                    const w = result.weather;
                    resultText = `${w.city}天气：\n温度：${w.temperature}\n天气：${w.condition}\n湿度：${w.humidity}\n风速：${w.wind}`;
                } else if (currentTool === 'search') {
                    resultText = result.result;
                } else if (currentTool === 'translate') {
                    resultText = result.translation;
                } else if (currentTool === 'datetime') {
                    const d = result.datetime;
                    resultText = `日期：${d.date}\n时间：${d.time}\n星期：${d.weekday}`;
                }
                
                addMessage(input, 'user');
                addMessage(resultText, 'bot');
            } else {
                alert(result.error);
            }
        }
        
        // 关闭模态框
        function closeModal() {
            document.getElementById('toolModal').classList.remove('active');
        }
        
        // 文件上传处理
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const result = await fileHandler.handleFile(file);
            
            if (result.success) {
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = `
                    <div class="agent-card">
                        <div class="agent-header">
                            <span class="agent-icon">📄</span>
                            <span class="agent-name">${result.filename}</span>
                        </div>
                        <div class="agent-desc">${result.message}</div>
                        ${result.type === 'image' ? `<img src="${result.dataUrl}" style="max-width:100%;border-radius:8px;margin-top:10px">` : ''}
                    </div>
                `;
            }
        }
        
        // 执行搜索
        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            
            const result = await tools.search(query);
            
            const container = document.getElementById('searchResults');
            container.innerHTML = `<div class="message bot">${result.result.replace(/\n/g, '<br>')}</div>`;
        }
        
        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            
            try {
                // 如果选择了智能体
                if (window.currentAgent) {
                    const result = await agents.callAgent(window.currentAgent, message);
                    addMessage(result.response, 'bot');
                } else {
                    // 普通对话
                    const response = await fetch(`${baseUrl}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'glm-4-flash',
                            messages: [{role: 'user', content: message}]
                        })
                    });
                    
                    const data = await response.json();
                    addMessage(data.choices[0].message.content, 'bot');
                }
            } catch (error) {
                addMessage('请求失败，请重试', 'bot');
            }
        }
        
        // 添加消息
        function addMessage(content, type) {
            const chatArea = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = content.replace(/\n/g, '<br>');
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // 初始化
        init();
    </script>
</body>
</html>
