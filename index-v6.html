<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKI V6 - 你的智能秘书</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --accent: #7B68EE;
            --dark: #1A1A2E;
            --light: #F5F7FA;
            --white: #FFFFFF;
            --gray: #95A5A6;
            --gray-light: #ECF0F1;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        /* ========== 顶部导航栏 ========== */
        .top-bar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .top-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            width: 40px;
            height: 40px;
            background: var(--light);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .menu-btn:hover {
            background: var(--primary);
            color: var(--white);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: bold;
            color: var(--dark);
        }
        
        .logo-icon {
            font-size: 32px;
        }
        
        .top-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .status-badge {
            padding: 6px 12px;
            background: var(--success);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            background: var(--light);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .icon-btn:hover {
            background: var(--primary);
            color: var(--white);
        }
        
        /* ========== 主内容区 ========== */
        .main-content {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            display: none;
        }
        
        .sidebar.active {
            display: block;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .sidebar-section {
            margin-bottom: 24px;
        }
        
        .sidebar-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-card {
            background: var(--light);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--gray);
            margin-top: 4px;
        }
        
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--light);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--dark);
        }
        
        .menu-item:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateX(4px);
        }
        
        /* 聊天区域 */
        .chat-area {
            flex: 1;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: calc(100vh - 140px);
        }
        
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--gray-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--dark);
        }
        
        .chat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--gray);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 消息列表 */
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message-wrapper {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }
        
        .message-wrapper.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .avatar.bot {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        }
        
        .avatar.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .message {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
        }
        
        .message.bot {
            background: var(--light);
            color: var(--dark);
            border-bottom-left-radius: 4px;
        }
        
        .message.user {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: var(--white);
            border-bottom-right-radius: 4px;
        }
        
        .privacy-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--warning);
            color: var(--dark);
            border-radius: 8px;
            font-size: 11px;
            margin-left: 8px;
        }
        
        /* 底部输入区 */
        .input-section {
            border-top: 1px solid var(--gray-light);
            padding: 16px 20px;
            background: var(--white);
        }
        
        /* 快捷功能栏 */
        .quick-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            margin-bottom: 12px;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        .quick-bar::-webkit-scrollbar {
            height: 4px;
        }
        
        .quick-btn {
            padding: 6px 14px;
            background: var(--light);
            border: 1px solid var(--gray-light);
            border-radius: 20px;
            font-size: 13px;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .quick-btn:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }
        
        /* 输入框 */
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .message-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--gray-light);
            border-radius: 16px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        
        .message-input:focus {
            border-color: var(--primary);
        }
        
        .action-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: var(--white);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .action-btn:hover {
            transform: scale(1.05);
        }
        
        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 200;
            }
            
            .main-content {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="top-bar">
        <div class="top-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="logo">
                <span class="logo-icon">🐼</span>
                <span>TOKI V6</span>
            </div>
        </div>
        <div class="top-right">
            <span class="status-badge" id="systemStatus">🟢 纯本地存储</span>
            <button class="icon-btn" onclick="showMemory()" title="记忆">🧠</button>
            <button class="icon-btn" onclick="showDNA()" title="DNA">🧬</button>
            <button class="icon-btn" onclick="showSettings()" title="设置">⚙️</button>
        </div>
    </header>
    
    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">📊 统计</div>
                <div class="stat-card">
                    <div class="stat-value" id="memoryCount">0</div>
                    <div class="stat-label">记忆条数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="dnaCount">0</div>
                    <div class="stat-label">DNA 特征</div>
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">🛠️ 功能</div>
                <div class="sidebar-menu">
                    <div class="menu-item" onclick="exportData()">
                        <span>📤</span>
                        <span>导出数据</span>
                    </div>
                    <div class="menu-item" onclick="clearAllData()">
                        <span>🗑️</span>
                        <span>清除所有数据</span>
                    </div>
                    <div class="menu-item" onclick="showPrivacyReport()">
                        <span>🔒</span>
                        <span>隐私报告</span>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- 聊天区域 -->
        <section class="chat-area">
            <div class="chat-header">
                <div class="chat-title">智能对话</div>
                <div class="chat-status">
                    <span class="status-dot"></span>
                    <span>阿里云 AI · 隐私脱敏</span>
                </div>
            </div>
            
            <div class="message-list" id="messageList">
                <div class="message-wrapper">
                    <div class="avatar bot">🐼</div>
                    <div class="message bot">
                        你好！我是 TOKI V6，你的私人 AI 秘书 🐼<br><br>
                        <strong>核心特性：</strong><br>
                        ✅ 纯本地存储 - 数据不出手机<br>
                        ✅ 硬件级加密 - AES-256<br>
                        ✅ 自动隐私脱敏 - 保护敏感信息<br>
                        ✅ DNA 学习 - 越用越懂你<br>
                        ✅ 记忆永久保存 - IndexedDB<br>
                        <br>
                        试试对我说些什么，我会记住我们的一切对话！
                    </div>
                </div>
            </div>
            
            <!-- 底部输入区 -->
            <div class="input-section">
                <!-- 快捷功能栏 -->
                <div class="quick-bar">
                    <button class="quick-btn" onclick="quickAsk('写一封邮件')">📧 写邮件</button>
                    <button class="quick-btn" onclick="quickAsk('总结文档')">📄 总结</button>
                    <button class="quick-btn" onclick="quickAsk('翻译')">🌐 翻译</button>
                    <button class="quick-btn" onclick="quickAsk('日程安排')">📅 日程</button>
                    <button class="quick-btn" onclick="quickAsk('识别图片')">📸 识图</button>
                    <button class="quick-btn" onclick="quickAsk('写代码')">💻 代码</button>
                    <button class="quick-btn" onclick="quickAsk('PPT 制作')">📊 PPT</button>
                    <button class="quick-btn" onclick="quickAsk('天气查询')">🌤️ 天气</button>
                    <button class="quick-btn" onclick="quickAsk('搜索')">🔍 搜索</button>
                    <button class="quick-btn" onclick="quickAsk('计算器')">🧮 计算</button>
                </div>
                
                <!-- 输入框 -->
                <div class="input-wrapper">
                    <input type="text" class="message-input" id="messageInput" placeholder="输入消息...（自动隐私脱敏）" onkeypress="handleKeyPress(event)">
                    <button class="action-btn" onclick="sendMessage()" title="发送">➤</button>
                    <button class="action-btn" onclick="toggleVoice()" title="语音">🎤</button>
                </div>
            </div>
        </section>
    </main>
    
    <!-- 集成 V6 核心 -->
    <script src="v6-core.js"></script>
    <script src="aliyun-client.js"></script>
    
    <script>
        // 全局状态
        let chatHistory = [];
        let isWaitingResponse = false;
        let v6Initialized = false;
        
        // 初始化 V6
        async function initV6() {
            console.log('🚀 TOKI V6 初始化中...');
            
            try {
                // 初始化 TOKIClaw 核心
                const success = await initTOKIV6();
                
                if (success) {
                    v6Initialized = true;
                    updateStats();
                    
                    document.getElementById('systemStatus').textContent = '🟢 纯本地存储 · 硬件加密';
                    document.getElementById('systemStatus').style.background = '#28a745';
                    
                    console.log('✅ TOKI V6 初始化完成');
                } else {
                    throw new Error('初始化失败');
                }
                
            } catch (e) {
                console.error('❌ V6 初始化失败:', e);
                document.getElementById('systemStatus').textContent = '🔴 初始化失败';
                document.getElementById('systemStatus').style.background = '#dc3545';
            }
        }
        
        // 更新统计
        async function updateStats() {
            if (!v6Initialized) return;
            
            try {
                const memStats = await memoryStore.getStats();
                const dnaStats = dnaSystem.getStats();
                
                document.getElementById('memoryCount').textContent = memStats.total;
                document.getElementById('dnaCount').textContent = 
                    dnaStats.preferences + dnaStats.habits + dnaStats.knowledge;
            } catch (e) {
                console.error('更新统计失败:', e);
            }
        }
        
        // 切换侧边栏
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }
        
        // 发送消息
        async function sendMessage() {
            if (isWaitingResponse) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 检查隐私
            const privacyCheck = PrivacyFilter.containsPrivacy(message);
            
            // 添加用户消息
            addMessage(message, 'user', privacyCheck.hasPrivacy);
            input.value = '';
            
            // 保存到记忆
            if (v6Initialized) {
                await memoryStore.add({
                    role: 'user',
                    content: message,
                    timestamp: Date.now()
                });
            }
            
            isWaitingResponse = true;
            showTypingIndicator();
            
            try {
                // 脱敏后发送给 AI
                const sanitized = PrivacyFilter.sanitize(message);
                
                const messages = [
                    { role: 'system', content: '你是 TOKI V6，用户的私人 AI 秘书。你有长期记忆，会学习用户偏好，越用越懂用户。' },
                    ...chatHistory.slice(-10),
                    { role: 'user', content: sanitized }
                ];
                
                const response = await aliyunClient.chat(messages);
                
                removeTypingIndicator();
                
                // 添加 AI 回复
                addMessage(response.content, 'bot', false);
                chatHistory.push({ role: 'assistant', content: response.content });
                
                // 保存到记忆
                if (v6Initialized) {
                    await memoryStore.add({
                        role: 'assistant',
                        content: response.content,
                        model: response.model,
                        timestamp: Date.now()
                    });
                    
                    // DNA 学习
                    await dnaSystem.learn(message, response.content);
                    
                    updateStats();
                }
                
                console.log('🧠 路由:', response.route?.intent, '→', response.model);
                
            } catch (e) {
                removeTypingIndicator();
                addMessage('抱歉，出错了：' + e.message, 'bot', false);
                console.error('发送失败:', e);
            }
            
            isWaitingResponse = false;
        }
        
        // 快捷提问
        function quickAsk(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }
        
        // 添加消息
        function addMessage(text, type, hasPrivacy) {
            const messageList = document.getElementById('messageList');
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper ' + type;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar ' + type;
            avatar.textContent = type === 'bot' ? '🐼' : '👤';
            
            const message = document.createElement('div');
            message.className = 'message ' + type;
            message.innerHTML = text.replace(/\n/g, '<br>');
            
            if (hasPrivacy) {
                const badge = document.createElement('span');
                badge.className = 'privacy-badge';
                badge.textContent = '🔒 已脱敏';
                message.appendChild(badge);
            }
            
            if (type === 'user') {
                wrapper.appendChild(message);
                wrapper.appendChild(avatar);
            } else {
                wrapper.appendChild(avatar);
                wrapper.appendChild(message);
            }
            
            messageList.appendChild(wrapper);
            messageList.scrollTop = messageList.scrollHeight;
        }
        
        // 回车发送
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 显示记忆
        async function showMemory() {
            if (!v6Initialized) {
                alert('V6 核心未初始化');
                return;
            }
            
            const stats = await memoryStore.getStats();
            alert(`记忆统计:\n\n总条数：${stats.total}\n存储位置：${stats.storage}\n已加密：${stats.encrypted}`);
        }
        
        // 显示 DNA
        function showDNA() {
            if (!v6Initialized) {
                alert('V6 核心未初始化');
                return;
            }
            
            const stats = dnaSystem.getStats();
            alert(`DNA 统计:\n\n偏好：${stats.preferences}\n习惯：${stats.habits}\n知识：${stats.knowledge}\n痛觉：${stats.pain}\n版本：${stats.version}`);
        }
        
        // 导出数据
        async function exportData() {
            if (!v6Initialized) {
                alert('V6 核心未初始化');
                return;
            }
            
            const data = await memoryStore.export();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `toki-v6-backup-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            alert('数据已导出！请妥善保存文件。');
        }
        
        // 清除所有数据
        async function clearAllData() {
            if (!confirm('⚠️ 警告：此操作将清除所有记忆和 DNA 数据，且无法恢复！\n\n确定要继续吗？')) {
                return;
            }
            
            if (!v6Initialized) {
                alert('V6 核心未初始化');
                return;
            }
            
            try {
                await memoryStore.clear();
                await dnaSystem.clear();
                
                document.getElementById('messageList').innerHTML = '';
                chatHistory = [];
                
                updateStats();
                
                alert('✅ 所有数据已清除');
                
            } catch (e) {
                alert('清除失败：' + e.message);
            }
        }
        
        // 显示隐私报告
        function showPrivacyReport() {
            alert('隐私保护报告\n\n✅ 所有数据本地存储（IndexedDB）\n✅ 硬件级加密（AES-256）\n✅ 发送前自动脱敏\n✅ 无云端备份\n✅ 用户完全控制');
        }
        
        // 显示设置
        function showSettings() {
            alert('设置\n\n版本：TOKI V6\n存储：IndexedDB（本地）\n加密：AES-256（硬件级）\n脱敏：自动\n\n更多功能开发中...');
        }
        
        // 语音输入
        function toggleVoice() {
            alert('语音功能开发中...');
        }
        
        // 显示正在输入
        function showTypingIndicator() {
            // TODO: 实现加载动画
        }
        
        function removeTypingIndicator() {
            // TODO: 移除加载动画
        }
        
        // 启动应用
        window.addEventListener('DOMContentLoaded', initV6);
        
        console.log('📦 TOKI V6 界面已加载');
    </script>
</body>
</html>
