<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKI 文件处理原型</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        /* 标题 */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        /* 上传区域 */
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-area:hover, .upload-area.dragover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .upload-text {
            color: #666;
            margin-bottom: 10px;
        }
        .upload-hint {
            font-size: 12px;
            color: #999;
        }
        
        /* 隐藏的文件输入 */
        #fileInput {
            display: none;
        }
        
        /* 文件列表 */
        .file-list {
            margin-bottom: 20px;
        }
        .file-item {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .file-icon {
            font-size: 32px;
            margin-right: 15px;
        }
        .file-info {
            flex: 1;
        }
        .file-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }
        .file-size {
            font-size: 12px;
            color: #666;
        }
        .file-actions button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .file-actions button:hover {
            opacity: 1;
        }
        
        /* 功能选择 */
        .feature-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .feature-tab {
            flex: 1;
            padding: 12px;
            background: #f8f9fa;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .feature-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        /* 结果区域 */
        .result-area {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            min-height: 200px;
        }
        .result-title {
            font-weight: 500;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-content {
            color: #666;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .result-content.empty {
            color: #999;
            font-style: italic;
        }
        
        /* 处理按钮 */
        .process-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        .process-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .process-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* OCR预览 */
        .ocr-preview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .preview-image {
            border-radius: 12px;
            overflow: hidden;
        }
        .preview-image img {
            width: 100%;
            height: auto;
            display: block;
        }
        .preview-text {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            font-size: 14px;
            line-height: 1.8;
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 40px;
        }
        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 提示 */
        .hint {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>📄 文件处理助手</h1>
            <p>支持 PDF 解析、OCR 识别、智能总结</p>
        </div>
        
        <!-- 上传区域 -->
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽文件到此处</div>
            <div class="upload-hint">支持 PDF、图片（JPG/PNG）、Word、Excel</div>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx">
        
        <!-- 文件列表 -->
        <div class="file-list" id="fileList"></div>
        
        <!-- 功能选择 -->
        <div class="feature-tabs">
            <button class="feature-tab active" data-feature="summary" onclick="selectFeature('summary')">
                📝 智能总结
            </button>
            <button class="feature-tab" data-feature="ocr" onclick="selectFeature('ocr')">
                👁️ OCR识别
            </button>
            <button class="feature-tab" data-feature="extract" onclick="selectFeature('extract')">
                🔍 提取信息
            </button>
        </div>
        
        <!-- 结果区域 -->
        <div class="result-area">
            <div class="result-title">
                <span id="resultIcon">📋</span>
                <span id="resultTitle">处理结果</span>
            </div>
            <div class="result-content empty" id="resultContent">
                上传文件后，点击处理按钮查看结果...
            </div>
        </div>
        
        <!-- 处理按钮 -->
        <button class="process-btn" id="processBtn" onclick="processFile()" disabled>
            开始处理
        </button>
        
        <!-- 提示 -->
        <div class="hint">
            💡 提示：文件仅在浏览器本地处理，不会上传到服务器
        </div>
    </div>

    <script>
        // ============ 状态管理 ============
        const state = {
            file: null,
            fileType: null,
            feature: 'summary',
            isProcessing: false
        };

        // ============ DOM元素 ============
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const processBtn = document.getElementById('processBtn');
        const resultContent = document.getElementById('resultContent');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');

        // ============ 文件上传 ============
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        // ============ 文件处理 ============
        function handleFile(file) {
            state.file = file;
            
            // 判断文件类型
            const ext = file.name.split('.').pop().toLowerCase();
            if (['pdf'].includes(ext)) {
                state.fileType = 'pdf';
            } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                state.fileType = 'image';
            } else if (['doc', 'docx'].includes(ext)) {
                state.fileType = 'word';
            } else if (['xls', 'xlsx'].includes(ext)) {
                state.fileType = 'excel';
            } else {
                state.fileType = 'other';
            }
            
            // 显示文件
            displayFile(file);
            
            // 启用处理按钮
            processBtn.disabled = false;
        }

        function displayFile(file) {
            const iconMap = {
                'pdf': '📕',
                'image': '🖼️',
                'word': '📘',
                'excel': '📗',
                'other': '📄'
            };
            
            const sizeStr = formatFileSize(file.size);
            
            fileList.innerHTML = `
                <div class="file-item">
                    <div class="file-icon">${iconMap[state.fileType]}</div>
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-size">${sizeStr}</div>
                    </div>
                    <div class="file-actions">
                        <button onclick="removeFile()">❌</button>
                    </div>
                </div>
            `;
        }

        function removeFile() {
            state.file = null;
            state.fileType = null;
            fileList.innerHTML = '';
            fileInput.value = '';
            processBtn.disabled = true;
            resultContent.textContent = '上传文件后，点击处理按钮查看结果...';
            resultContent.classList.add('empty');
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // ============ 功能选择 ============
        function selectFeature(feature) {
            state.feature = feature;
            
            document.querySelectorAll('.feature-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`[data-feature="${feature}"]`).classList.add('active');
            
            // 更新结果标题
            const titles = {
                'summary': { icon: '📝', title: '智能总结' },
                'ocr': { icon: '👁️', title: 'OCR识别结果' },
                'extract': { icon: '🔍', title: '提取信息' }
            };
            
            resultIcon.textContent = titles[feature].icon;
            resultTitle.textContent = titles[feature].title;
        }

        // ============ 处理文件 ============
        async function processFile() {
            if (!state.file || state.isProcessing) return;
            
            state.isProcessing = true;
            processBtn.disabled = true;
            processBtn.textContent = '处理中...';
            
            resultContent.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <span>正在处理文件...</span>
                </div>
            `;
            resultContent.classList.remove('empty');
            
            try {
                let result;
                
                switch (state.feature) {
                    case 'summary':
                        result = await processSummary();
                        break;
                    case 'ocr':
                        result = await processOCR();
                        break;
                    case 'extract':
                        result = await processExtract();
                        break;
                }
                
                resultContent.textContent = result;
                
            } catch (error) {
                resultContent.textContent = '❌ 处理失败: ' + error.message;
            }
            
            state.isProcessing = false;
            processBtn.disabled = false;
            processBtn.textContent = '开始处理';
        }

        // ============ 智能总结 ============
        async function processSummary() {
            // 模拟处理
            await delay(1500);
            
            if (state.fileType === 'pdf') {
                return `【PDF 文档总结】

文件名：${state.file.name}

📋 主要内容：
本文档包含以下核心内容：

1. 项目背景介绍
   - 行业现状分析
   - 市场需求调研
   
2. 解决方案概述
   - 技术架构设计
   - 核心功能模块
   
3. 实施计划
   - 时间安排
   - 资源分配
   
4. 预期成果
   - 性能指标
   - 商业价值

💡 关键洞察：
文档结构清晰，内容完整，建议重点关注第三章实施计划部分。`;
            } else {
                return `【文件总结】

文件名：${state.file.name}
文件类型：${state.fileType.toUpperCase()}

📋 主要内容：
这是一个 ${state.fileType.toUpperCase()} 格式的文件，大小 ${formatFileSize(state.file.size)}。

💡 建议：
- 如需提取文本内容，请使用 OCR 功能
- 如需提取关键信息，请使用提取功能`;
            }
        }

        // ============ OCR识别 ============
        async function processOCR() {
            // 如果是图片，显示预览
            if (state.fileType === 'image') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    resultContent.innerHTML = `
                        <div class="ocr-preview">
                            <div class="preview-image">
                                <img src="${e.target.result}" alt="预览">
                            </div>
                            <div class="preview-text">
                                <strong>识别结果：</strong><br><br>
                                ${generateOCRText()}
                            </div>
                        </div>
                    `;
                };
                reader.readAsDataURL(state.file);
                await delay(2000);
                return '';
            } else {
                await delay(1500);
                return `【OCR识别结果】

文件名：${state.file.name}

识别到的文本内容：

━━━━━━━━━━━━━━━━━━━

尊敬的用户：

您好！

这是一份示例文档，用于演示
TOKI 的 OCR 识别功能。

主要特点：
• 支持中英文混合识别
• 准确率高达 98%+
• 保留原始排版格式

━━━━━━━━━━━━━━━━━━━

💡 提示：实际识别效果取决于图片清晰度`;
            }
        }

        function generateOCRText() {
            const texts = [
                '这是一张示例图片',
                '识别到的文字内容',
                'TOKI OCR 功能演示',
                '支持多语言识别',
                '准确率高达 98%'
            ];
            return texts.join('<br>');
        }

        // ============ 信息提取 ============
        async function processExtract() {
            await delay(1500);
            
            return `【信息提取结果】

文件名：${state.file.name}

━━━━━━━━━━━━━━━━━━━

📌 关键信息：

• 日期：2026-04-13
• 类型：${state.fileType.toUpperCase()}
• 大小：${formatFileSize(state.file.size)}

📌 识别到的实体：

• 金额：¥0.00
• 电话：暂无
• 邮箱：暂无
• 地址：暂无

📌 关键词：

文档、文件、处理、识别、提取

━━━━━━━━━━━━━━━━━━━

💡 提示：更精确的提取需要接入 AI 模型`;
        }

        // ============ 工具函数 ============
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ============ 初始化 ============
        console.log('📄 文件处理助手已加载');
    </script>
</body>
</html>
