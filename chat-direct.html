<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKI - 智能对话</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 { font-size: 24px; margin-bottom: 5px; }
        .chat-header p { opacity: 0.9; font-size: 14px; }
        .message-list {
            padding: 20px;
            height: 500px;
            overflow-y: auto;
            background: #f9f9f9;
        }
        .message {
            margin: 10px 0;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.6;
        }
        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }
        .message.bot {
            background: #e9ecef;
            color: #333;
        }
        .input-area {
            padding: 20px;
            background: white;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            padding: 10px 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🐼 TOKI 智能对话</h1>
            <p>阿里云 AI · 实时对话</p>
        </div>
        
        <div class="status" id="status">
            状态：检查中...
        </div>
        
        <div class="message-list" id="messageList">
            <div class="message bot">
                你好！我是 TOKI，你的智能助手 👋<br>
                有什么可以帮你的吗？
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="sendBtn">发送</button>
        </div>
    </div>
    
    <script>
        // 内嵌阿里云客户端
        const API_KEY = 'sk-ebea5eacead94e65aaec23f101a20a44';
        const API_URL = 'https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation';
        
        let isSending = false;
        
        // 检查状态
        async function checkStatus() {
            const statusEl = document.getElementById('status');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'qwen-turbo',
                        input: { messages: [{ role: 'user', content: 'test' }] },
                        parameters: { max_tokens: 5 }
                    })
                });
                
                if (response.ok) {
                    statusEl.textContent = '状态：✅ 在线可用';
                    statusEl.style.background = '#d4edda';
                    statusEl.style.color = '#155724';
                } else {
                    const error = await response.json();
                    statusEl.textContent = `状态：⚠️ ${error.message || 'API 错误'}`;
                }
            } catch (e) {
                statusEl.textContent = `状态：❌ ${e.message}`;
                statusEl.style.background = '#f8d7da';
                statusEl.style.color = '#721c24';
            }
        }
        
        // 发送消息
        async function sendMessage() {
            if (isSending) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 添加用户消息
            addMessage(message, 'user');
            input.value = '';
            
            // 禁用按钮
            isSending = true;
            document.getElementById('sendBtn').disabled = true;
            
            // 显示加载中
            addMessage('思考中...', 'bot', 'loading');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'qwen-plus',
                        input: {
                            messages: [
                                { role: 'system', content: '你是 TOKI，一个友好、智能的 AI 助手。' },
                                { role: 'user', content: message }
                            ]
                        },
                        parameters: {
                            temperature: 0.7,
                            max_tokens: 2000,
                            result_format: 'message'
                        }
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'API 错误');
                }
                
                const data = await response.json();
                
                // 移除加载消息
                const loadingMsg = document.querySelector('.message.bot:last-child');
                if (loadingMsg && loadingMsg.textContent.includes('思考中')) {
                    loadingMsg.remove();
                }
                
                // 添加 AI 回复
                const reply = data.output?.choices?.[0]?.message?.content || '没有收到回复';
                addMessage(reply, 'bot');
                
            } catch (e) {
                // 移除加载消息
                const loadingMsg = document.querySelector('.message.bot:last-child');
                if (loadingMsg) loadingMsg.remove();
                
                addMessage(`❌ 错误：${e.message}`, 'bot');
            }
            
            isSending = false;
            document.getElementById('sendBtn').disabled = false;
        }
        
        // 添加消息
        function addMessage(text, type, extraClass = '') {
            const list = document.getElementById('messageList');
            const div = document.createElement('div');
            div.className = `message ${type} ${extraClass}`;
            div.innerHTML = text.replace(/\n/g, '<br>');
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }
        
        // 回车发送
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 页面加载后检查状态
        window.addEventListener('DOMContentLoaded', checkStatus);
        
        console.log('对话页面已加载');
    </script>
</body>
</html>
