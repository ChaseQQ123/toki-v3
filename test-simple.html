<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKI V6 - 快速测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .test-item { padding: 15px; margin: 10px 0; border-radius: 8px; background: #f9f9f9; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .btn { display: block; width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .result { margin-top: 20px; padding: 20px; background: #f0f0f0; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 TOKI V6 快速测试</h1>
        <div id="results"></div>
        <button class="btn" onclick="runTests()">▶️ 开始测试</button>
        <div class="result" id="log">点击按钮开始测试...</div>
    </div>
    
    <script>
        // 内嵌 PrivacyFilter
        const PrivacyFilter = {
            sanitize: function(text) {
                let result = text;
                result = result.replace(/1[3-9]\d{9}/g, '[手机号]');
                result = result.replace(/[\u4e00-\u9fa5]{3,}(省 | 市 | 区|县 | 路 | 街 | 号)/g, '[地址]');
                result = result.replace(/[\w.-]+@[\w.-]+\.\w+/g, '[邮箱]');
                return result;
            }
        };
        
        // 内嵌简单路由
        const simpleRouter = {
            selectModel: function(msg) {
                if (/图片 | 照片 | 图像 | 识别/i.test(msg)) return 'qwen-vl-max';
                if (/^你好/i.test(msg)) return 'qwen-turbo';
                if (/为什么 | 是什么/i.test(msg)) return 'qwen-plus';
                if (/代码 | 编程/i.test(msg)) return 'qwen-coder';
                return 'qwen-plus';
            }
        };
        
        async function runTests() {
            const log = document.getElementById('log');
            const results = document.getElementById('results');
            let output = '';
            let passCount = 0;
            let failCount = 0;
            
            output += '开始测试...\n\n';
            
            // 测试 1: PrivacyFilter
            output += '1. 隐私脱敏测试:\n';
            try {
                const test1 = PrivacyFilter.sanitize('手机号 13812345678');
                if (test1.includes('[手机号]')) {
                    output += '   ✅ 手机号脱敏通过\n';
                    passCount++;
                } else {
                    output += `   ❌ 手机号脱敏失败：${test1}\n`;
                    failCount++;
                }
                
                const test2 = PrivacyFilter.sanitize('北京朝阳区');
                if (test2.includes('[地址]')) {
                    output += '   ✅ 地址脱敏通过\n';
                    passCount++;
                } else {
                    output += `   ❌ 地址脱敏失败：${test2}\n`;
                    failCount++;
                }
            } catch (e) {
                output += `   ❌ 错误：${e.message}\n`;
                failCount++;
            }
            
            // 测试 2: 路由
            output += '\n2. 智能路由测试:\n';
            try {
                const route1 = simpleRouter.selectModel('你好');
                output += `   你好 → ${route1}\n`;
                
                const route2 = simpleRouter.selectModel('识别图片');
                output += `   识别图片 → ${route2}\n`;
                passCount += 2;
            } catch (e) {
                output += `   ❌ 错误：${e.message}\n`;
                failCount++;
            }
            
            // 测试 3: 外部文件
            output += '\n3. 外部文件加载测试:\n';
            try {
                const response = await fetch('v6-core.js');
                if (response.ok) {
                    output += '   ✅ v6-core.js 可访问\n';
                    passCount++;
                } else {
                    output += '   ❌ v6-core.js 不可访问\n';
                    failCount++;
                }
            } catch (e) {
                output += `   ❌ 错误：${e.message}\n`;
                failCount++;
            }
            
            // 总结
            output += `\n==========\n`;
            output += `通过：${passCount}\n`;
            output += `失败：${failCount}\n`;
            output += `==========\n`;
            
            log.textContent = output;
            
            // 显示结果
            results.innerHTML = `
                <div class="test-item ${failCount === 0 ? 'pass' : 'fail'}">
                    <strong>测试结果：${failCount === 0 ? '✅ 全部通过' : '❌ 部分失败'}</strong>
                    <br>通过：${passCount} | 失败：${failCount}
                </div>
            `;
        }
        
        console.log('测试页面已加载');
    </script>
</body>
</html>
