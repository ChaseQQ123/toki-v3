<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKI 全能工具箱 - 64项功能</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1600px; margin: 0 auto; }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 18px;
            opacity: 0.95;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }
        
        .stat {
            background: rgba(255,255,255,0.2);
            padding: 10px 25px;
            border-radius: 20px;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        
        /* 分类标签 */
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            padding: 0 10px;
        }
        
        .category-tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .category-tab:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }
        
        .category-tab.active {
            background: white;
            color: #667eea;
            border-color: white;
        }
        
        /* 分类区域 */
        .category-section {
            margin-bottom: 30px;
        }
        
        .category-title {
            color: white;
            font-size: 24px;
            margin-bottom: 15px;
            padding-left: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .category-count {
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 12px;
        }
        
        /* 工具网格 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        
        .tool-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }
        
        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        .tool-icon {
            font-size: 36px;
            margin-bottom: 10px;
            display: block;
        }
        
        .tool-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .tool-desc {
            font-size: 12px;
            color: #888;
            line-height: 1.4;
        }
        
        .tool-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .tool-badge.hot {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
        }
        
        .close-btn:hover { color: #333; }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .result-title {
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        .result-content {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 14px;
        }
        
        .file-upload {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .file-upload:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }
        
        .file-upload-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* API配置提示 */
        .api-notice {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .api-notice-icon {
            font-size: 24px;
        }
        
        .api-notice-text {
            flex: 1;
            font-size: 14px;
            color: #333;
        }
        
        .api-notice-text strong {
            color: #667eea;
        }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 28px; }
            .tools-grid { grid-template-columns: repeat(2, 1fr); }
            .modal-content { padding: 20px; }
            .stats { flex-wrap: wrap; gap: 10px; }
        }
    </style>
</head>

            { id: 'agent-code', icon: '💻', title: '编程助手', desc: '代码编写、调试', category: 'agent', hot: true },
            
            // 🧠 记忆系统

            // 智能体执行
            { id: 'agent-execute', icon: '🤖', title: '智能体执行', desc: '自动分解任务并执行', category: 'doc', badge: 'NEW' },
        ];
        
        // 渲染工具
        function renderTools(filter = 'all') {
            const container = document.getElementById('toolsContainer');
            
            // 按分类分组
            const categories = {
                'chat': { name: '💬 对话', tools: [] },
                'write': { name: '📝 写作', tools: [] },
                'learn': { name: '📚 学习', tools: [] },
                'tool': { name: '🛠️ 工具', tools: [] },
                'fun': { name: '🎭 娱乐', tools: [] },
                'doc': { name: '📄 文档处理', tools: [] },
                'agent': { name: '🤖 智能体', tools: [] },
                'memory': { name: '🧠 记忆系统', tools: [] }
            };
            
            // 分组
            allTools.forEach(tool => {
                if (filter === 'all' || tool.category === filter) {
                    if (categories[tool.category]) {
                        categories[tool.category].tools.push(tool);
                    }
                }
            });
            
            // 渲染
            let html = '';
            Object.entries(categories).forEach(([key, cat]) => {
                if (cat.tools.length > 0) {
                    html += `
                        <div class="category-section" data-category="${key}">
                            <div class="category-title">
                                ${cat.name}
                                <span class="category-count">${cat.tools.length}项</span>
                            </div>
                            <div class="tools-grid">
                                ${cat.tools.map(tool => `
                                    <div class="tool-card" onclick="openTool('${tool.id}')">
                                        ${tool.badge ? `<span class="tool-badge">${tool.badge}</span>` : ''}
                                        ${tool.hot ? `<span class="tool-badge hot">HOT</span>` : ''}
                                        <span class="tool-icon">${tool.icon}</span>
                                        <div class="tool-title">${tool.title}</div>
                                        <div class="tool-desc">${tool.desc}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            });
            
            container.innerHTML = html;
        }
        
        // 分类筛选
        function filterCategory(category) {
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            renderTools(category);
        }
        
        // 打开工具
        function openTool(toolId) {
            const tool = allTools.find(t => t.id === toolId);
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            
            let html = `
                <div class="modal-header">
                    <div class="modal-title">${tool.icon} ${tool.title}</div>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
            `;
            
            // 根据不同工具显示不同内容
            html += getToolForm(toolId);
            
            content.innerHTML = html;
            modal.classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function getToolForm(toolId) {
            const forms = {

                            <textarea class="form-textarea" id="userInput" rows="4" placeholder="输入你的问题..." required></textarea>
                        </div>
                        <button type="submit" class="btn" id="submitBtn">发送</button>
                    </form>
                    <div id="result"></div>
                `,
                
                'moments': `

                        </div>
                        <button type="submit" class="btn">生成文案</button>
                    </form>
                    <div id="result"></div>
                `,
                
                'xiaohongshu': `

                            <textarea class="form-textarea" id="userInput" rows="3" placeholder="例如：成都美食推荐" required></textarea>
                        </div>
                        <button type="submit" class="btn">生成笔记</button>
                    </form>
                    <div id="result"></div>
                `,
                
                'email': `

        // 调用AI
        async function callAI(event, prompt, inputId, resultId) {
            event.preventDefault();
            const btn = event.target.querySelector('.btn');
            const result = document.getElementById(resultId);
            const input = document.getElementById(inputId);
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>处理中...';
            
            try {
                const response = await fetch(`${API_BASE}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'glm-4-flash',
                        messages: [{ role: 'user', content: prompt + input.value }]
                    })
                });
                
                const data = await response.json();
                const content = data.choices[0].message.content;
                
                result.innerHTML = `
                    <div class="result-box">
                        <div class="result-title">✅ 结果</div>
                        <div class="result-content">${content}</div>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `<div class="result-box"><div class="result-content" style="color: red;">请求失败: ${error.message}</div></div>`;
            }
            
            btn.disabled = false;
            btn.innerHTML = '发送';
        }

            const prompt = document.getElementById('imagePrompt').value;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>生成中...';
            
            try {
                const response = await fetch(`${API_BASE}/images/generations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'cogview-3-flash',
                        prompt: prompt
                    })
                });
                
                const data = await response.json();
                const imageUrl = data.data[0].url;
                
                result.innerHTML = `
                    <div class="result-box">
                        <div class="result-title">✅ 图片生成成功</div>
                        <img src="${imageUrl}" style="width: 100%; margin-top: 10px; border-radius: 8px;">
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `<div class="result-box"><div class="result-content" style="color: red;">生成失败: ${error.message}</div></div>`;
            }
            
            btn.disabled = false;
            btn.innerHTML = '生成图片';
        }
        
        // 查询天气
        async function getWeather(event) {
            event.preventDefault();
            const btn = event.target.querySelector('.btn');
            const result = document.getElementById('result');
            const city = document.getElementById('cityName').value;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>查询中...';
            
            try {
                const response = await fetch(`https://wttr.in/${city}?format=j1`);
                const data = await response.json();
                const current = data.current_condition[0];
                
                result.innerHTML = `
                    <div class="result-box">
                        <div class="result-title">🌤️ ${city} 天气</div>
                        <div class="result-content">
温度: ${current.temp_C}°C
天气: ${current.weatherDesc[0].value}
湿度: ${current.humidity}%
风速: ${current.windspeedKmph} km/h
                        </div>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `<div class="result-box"><div class="result-content" style="color: red;">查询失败: ${error.message}</div></div>`;
            }
            
            btn.disabled = false;
            btn.innerHTML = '查询天气';
        }
        
        // 计算器
        function calculate(event) {
            event.preventDefault();
            const result = document.getElementById('result');
            const expr = document.getElementById('expression').value;
            
            try {
                const ans = Function('"use strict"; return (' + expr + ')')();
                result.innerHTML = `
                    <div class="result-box">
                        <div class="result-title">计算结果</div>
                        <div class="result-content">${expr} = ${ans}</div>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `<div class="result-box"><div class="result-content" style="color: red;">计算错误: ${error.message}</div></div>`;
            }
        }
        
        // 更新文件名
        function updateFileName(input, displayId) {
            document.getElementById(displayId).textContent = '已选择: ' + input.files[0].name;
        }
        
        // 记忆功能
        const memoryKey = 'toki_memory';
        
        async function memorize(event) {
            event.preventDefault();
            const result = document.getElementById('result');
            const input = document.getElementById('memoryInput').value;
            
            const memories = JSON.parse(localStorage.getItem(memoryKey) || '[]');
            memories.push({
                id: Date.now(),
                content: input,
                time: new Date().toISOString()
            });
            localStorage.setItem(memoryKey, JSON.stringify(memories));
            
            result.innerHTML = `
                <div class="result-box">
                    <div class="result-title">✅ 已记住</div>
                    <div class="result-content">${input}</div>
                </div>
            `;
        }
        
        async function recall(event) {
            event.preventDefault();
            const result = document.getElementById('result');
            const query = document.getElementById('recallQuery').value.toLowerCase();
            
            const memories = JSON.parse(localStorage.getItem(memoryKey) || '[]');
            const found = memories.filter(m => m.content.toLowerCase().includes(query));
            
            if (found.length > 0) {
                result.innerHTML = `
                    <div class="result-box">
                        <div class="result-title">找到 ${found.length} 条记忆</div>
                        <div class="result-content">${found.map(m => `• ${m.content}`).join('\n')}</div>
                    </div>
                `;
            } else {
                result.innerHTML = `<div class="result-box"><div class="result-content">没有找到相关记忆</div></div>`;
            }
        }
        
        // 智能体调用
        const agents = {
            dataAnalyst: '你是一个专业的数据分析师，擅长数据分析、统计和可视化。',
            businessAssistant: '你是一个专业的商务助手，精通商业文档撰写、市场分析。',
            codeHelper: '你是一个专业的编程助手，精通多种编程语言和技术栈。'
        };
        
        async function callAgent(event, agentId) {
            event.preventDefault();
            const btn = event.target.querySelector('.btn');
            const result = document.getElementById('result');
            const task = document.getElementById('agentTask').value;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>处理中...';
            
            try {
                const response = await fetch(`${API_BASE}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'glm-4-flash',
                        messages: [
                            { role: 'system', content: agents[agentId] },
                            { role: 'user', content: task }
                        ]
                    })
                });
                
                const data = await response.json();
                const content = data.choices[0].message.content;
                
                result.innerHTML = `
                    <div class="result-box">
                        <div class="result-title">✅ 完成</div>
                        <div class="result-content">${content}</div>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `<div class="result-box"><div class="result-content" style="color: red;">请求失败: ${error.message}</div></div>`;
            }
            
            btn.disabled = false;
            btn.innerHTML = '发送';
        }
        
        // 日期时间
        function updateDateTime() {
            const now = new Date();
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const el = document.getElementById('datetimeResult');
            if (el) {
                el.innerHTML = `
📅 日期: ${now.toLocaleDateString('zh-CN')}
⏰ 时间: ${now.toLocaleTimeString('zh-CN')}
📆 星期: ${weekdays[now.getDay()]}
🔢 时间戳: ${now.getTime()}
                `;
            }
        }
        
        // 语音合成
        async function textToSpeech(event) {
            event.preventDefault();
            const btn = event.target.querySelector('.btn');
            const result = document.getElementById('result');
            const text = document.getElementById('ttsText').value;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>生成中...';
            
            try {
                // 使用浏览器内置语音合成
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                
                window.speechSynthesis.speak(utterance);
                
                result.innerHTML = `
                    <div class="result-box">
                        <div class="result-title">✅ 正在播放</div>
                        <div class="result-content">${text}</div>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `<div class="result-box"><div class="result-content" style="color: red;">播放失败: ${error.message}</div></div>`;
            }
            
            btn.disabled = false;
            btn.innerHTML = '播放语音';
        }
        
        // 初始化
        renderTools();
        
        // 更新时间
        setInterval(updateDateTime, 1000);
        updateDateTime();
        
        // 点击模态框外部关闭
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
