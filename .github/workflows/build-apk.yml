name: Build iOS & Android Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      working-directory: ./native-build
      run: npm install
    
    - name: Build Android APK
      working-directory: ./native-build
      run: |
        npx cap add android
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload Android APK
      uses: actions/upload-artifact@v3
      with:
        name: toki-android
        path: native-build/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    name: Build iOS App
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      working-directory: ./native-build
      run: npm install
    
    - name: Build iOS App
      working-directory: ./native-build
      run: |
        npx cap add ios
        npx cap sync ios
    
    - name: Archive iOS App
      working-directory: ./native-build/ios/App
      run: |
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    
    - name: Create IPA
      working-directory: ./native-build/ios/App
      run: |
        mkdir -p build/Payload
        cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
        cd build
        zip -r toki-ios.ipa Payload
    
    - name: Upload iOS IPA
      uses: actions/upload-artifact@v3
      with:
        name: toki-ios
        path: native-build/ios/App/build/toki-ios.ipa
