<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKI - 真实语音对话 (GLM-4-Voice)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .timer {
            font-size: 18px;
            font-weight: bold;
        }
        
        .ai-avatar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .ai-avatar {
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(255,255,255,0.3);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .ai-status {
            font-size: 18px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .ai-message {
            background: rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 20px;
            max-width: 80%;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            min-height: 60px;
        }
        
        .controls {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .start-btn {
            background: #4CAF50;
            color: white;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .start-btn:hover {
            transform: scale(1.1);
        }
        
        .end-btn {
            background: #ff4444;
            color: white;
        }
        
        .hint {
            text-align: center;
            padding: 10px 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        
        .cost-info {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <div class="timer" id="timer">00:00</div>
        </div>
        
        <div class="cost-info" id="costInfo">
            💰 GLM-4-Voice: 80元/百万tokens
        </div>
        
        <div class="ai-avatar-container">
            <div class="ai-avatar" id="aiAvatar">🤖</div>
            <div class="ai-status" id="aiStatus">点击开始真实语音对话</div>
            <div class="ai-message" id="aiMessage">你好！我是TOKI，使用GLM-4-Voice语音模型。现在我会真正听懂你的声音，并用自然语音回复！</div>
        </div>
        
        <div class="controls">
            <button class="start-btn" id="startBtn" onclick="startRecording()">🎤</button>
            <button class="end-btn" id="endBtn" onclick="stopRecording()" style="display:none;">⏹️</button>
        </div>
        
        <div class="hint" id="hint">按住麦克风按钮说话，松开发送</div>
    </div>
    
    <script>
        const API_KEY = 'c4911cf15f844167bd26301e25622cf1.n1BU10ytXbnQ6N5d';
        const BASE_URL = 'https://open.bigmodel.cn/api/paas/v4';
        
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let audioContext = null;
        
        function goBack() {
            window.location.href = 'index.html';
        }
        
        // 开始录音
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await sendToGLM4Voice(audioBlob);
                };
                
                mediaRecorder.start();
                isRecording = true;
                
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('endBtn').style.display = 'flex';
                document.getElementById('aiStatus').textContent = '正在录音...说话吧';
                document.getElementById('aiAvatar').style.animation = 'pulse 0.5s ease-in-out infinite';
                
            } catch (error) {
                alert('无法访问麦克风：' + error.message);
            }
        }
        
        // 停止录音
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                
                document.getElementById('startBtn').style.display = 'flex';
                document.getElementById('endBtn').style.display = 'none';
                document.getElementById('aiStatus').textContent = '发送中...';
                document.getElementById('aiAvatar').style.animation = 'pulse 2s ease-in-out infinite';
            }
        }
        
        // 发送到GLM-4-Voice
        async function sendToGLM4Voice(audioBlob) {
            try {
                // 将音频转为Base64
                const reader = new FileReader();
                reader.onload = async () => {
                    const base64Audio = reader.result.split(',')[1];
                    
                    // 调用GLM-4-Voice API
                    const response = await fetch(`${BASE_URL}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify({
                            model: 'glm-4-voice',
                            messages: [{
                                role: 'user',
                                content: [
                                    {
                                        type: 'text',
                                        text: '请用自然友好的语气回复我的语音'
                                    },
                                    {
                                        type: 'input_audio',
                                        input_audio: {
                                            data: base64Audio,
                                            format: 'wav'
                                        }
                                    }
                                ]
                            }],
                            stream: false
                        })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        const reply = data.choices[0].message.content;
                        const audioData = data.choices[0].message.audio?.data;
                        
                        // 显示文字回复
                        document.getElementById('aiMessage').textContent = reply;
                        document.getElementById('aiStatus').textContent = '回复中...';
                        
                        // 如果有音频数据，播放
                        if (audioData) {
                            playAudio(audioData);
                        } else {
                            // 如果没有音频数据，使用Web Speech API朗读
                            const utterance = new SpeechSynthesisUtterance(reply);
                            utterance.lang = 'zh-CN';
                            window.speechSynthesis.speak(utterance);
                        }
                        
                        document.getElementById('aiStatus').textContent = '点击麦克风继续对话';
                    } else {
                        throw new Error('API调用失败');
                    }
                };
                reader.readAsDataURL(audioBlob);
                
            } catch (error) {
                console.error('错误:', error);
                document.getElementById('aiStatus').textContent = '出错了，请重试';
                document.getElementById('aiMessage').textContent = '网络错误，请检查连接后重试';
            }
        }
        
        // 播放音频
        function playAudio(base64Audio) {
            try {
                const audioData = atob(base64Audio);
                const arrayBuffer = new ArrayBuffer(audioData.length);
                const view = new Uint8Array(arrayBuffer);
                
                for (let i = 0; i < audioData.length; i++) {
                    view[i] = audioData.charCodeAt(i);
                }
                
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                audioContext.decodeAudioData(arrayBuffer, (buffer) => {
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioContext.destination);
                    source.start(0);
                    
                    source.onended = () => {
                        document.getElementById('aiStatus').textContent = '点击麦克风继续对话';
                    };
                });
                
            } catch (error) {
                console.error('音频播放失败:', error);
            }
        }
    </script>
</body>
</html>
