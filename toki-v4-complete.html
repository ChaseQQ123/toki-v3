<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKI V4.0 - AI Panda Assistant</title>
    <meta name="description" content="TOKI - 来自四川的熊猫AI助手，支持语音通话、视频通话、智能对话">
    <meta name="theme-color" content="#667eea">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        /* 头部 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo { font-size: 28px; }
        .title { font-size: 20px; font-weight: bold; }
        .version { background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 10px; font-size: 11px; }
        
        /* AI状态 */
        .ai-status {
            background: #d4edda;
            padding: 8px 20px;
            font-size: 13px;
            color: #155724;
            text-align: center;
        }
        
        /* 功能导航 */
        .feature-nav {
            display: flex;
            overflow-x: auto;
            padding: 15px 10px;
            gap: 10px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
        }
        .feature-nav::-webkit-scrollbar { display: none; }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 20px;
            background: #f8f9fa;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 80px;
        }
        .nav-item:hover, .nav-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
        }
        .nav-icon { font-size: 28px; margin-bottom: 5px; }
        .nav-label { font-size: 12px; white-space: nowrap; }
        
        /* 内容区 */
        .content { flex: 1; overflow-y: auto; padding: 20px; }
        .tab { display: none; }
        .tab.active { display: block; }
        
        /* 对话区 */
        .chat-area { padding: 0; }
        .message { margin-bottom: 20px; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.bot { display: flex; gap: 12px; }
        .bot-avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0;
        }
        .bot-content { flex: 1; }
        .bot-name { font-size: 12px; color: #999; margin-bottom: 5px; }
        .bot-text {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 16px 16px 16px 4px;
            font-size: 15px; line-height: 1.6; color: #333;
        }
        .message.user { display: flex; justify-content: flex-end; }
        .user-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 16px 16px 4px 16px;
            font-size: 15px; line-height: 1.6;
            max-width: 80%;
        }
        
        /* 打字动画 */
        .typing-indicator { display: flex; gap: 4px; padding: 15px; }
        .typing-dot {
            width: 8px; height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-5px); }
        }
        
        /* 熊猫形象 */
        .panda-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        .panda-face {
            width: 200px; height: 200px;
            background: white;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .panda-ear { width: 50px; height: 50px; background: #1a1a1a; border-radius: 50%; position: absolute; top: -10px; }
        .panda-ear.left { left: 10px; }
        .panda-ear.right { right: 10px; }
        .panda-eye-patch { width: 60px; height: 65px; background: #1a1a1a; border-radius: 50%; position: absolute; top: 50px; }
        .panda-eye-patch.left { left: 20px; transform: rotate(5deg); }
        .panda-eye-patch.right { right: 20px; transform: rotate(-5deg); }
        .panda-eye { width: 25px; height: 25px; background: white; border-radius: 50%; position: absolute; top: 65px; }
        .panda-eye.left { left: 38px; }
        .panda-eye.right { right: 38px; }
        .panda-pupil { width: 12px; height: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; position: absolute; top: 70px; }
        .panda-pupil.left { left: 45px; }
        .panda-pupil.right { right: 45px; }
        .panda-nose { width: 20px; height: 15px; background: #1a1a1a; border-radius: 50%; position: absolute; top: 110px; left: 50%; transform: translateX(-50%); }
        .panda-mouth { width: 30px; height: 15px; position: absolute; top: 130px; left: 50%; transform: translateX(-50%); }
        .panda-mouth::before, .panda-mouth::after { content: ''; width: 15px; height: 8px; border: 2px solid #1a1a1a; border-top: none; border-radius: 0 0 50% 50%; position: absolute; }
        .panda-mouth::before { left: 0; }
        .panda-mouth::after { right: 0; }
        .panda.speaking .panda-mouth { animation: speaking 0.15s infinite; }
        @keyframes speaking { 0%, 100% { height: 15px; } 50% { height: 25px; } }
        
        .call-status { font-size: 18px; color: #333; margin-bottom: 10px; }
        .call-hint { font-size: 14px; color: #666; }
        .call-btn {
            margin-top: 20px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
        
        /* 智能体卡片 */
        .agent-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .agent-card:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
        }
        
        /* 输入区 */
        .input-area {
            background: white;
            padding: 15px 20px;
            border-top: 1px solid #f0f0f0;
        }
        .input-tools { display: flex; gap: 10px; margin-bottom: 12px; }
        .tool-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 16px;
            background: #f8f9fa;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tool-btn:hover { background: #667eea; color: white; }
        .input-wrapper { display: flex; gap: 10px; align-items: flex-end; }
        .input-box {
            flex: 1;
            background: #f8f9fa;
            border-radius: 24px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
        }
        .input-box input {
            flex: 1;
            border: none;
            background: none;
            font-size: 15px;
            outline: none;
        }
        .send-btn {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .send-btn:hover { transform: scale(1.1); }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        /* 底部导航 */
        .bottom-nav {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .nav-item-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 5px 20px;
            transition: all 0.3s;
        }
        .nav-item-bottom.active { color: #667eea; }
        .nav-icon-bottom { font-size: 24px; }
        .nav-label-bottom { font-size: 11px; }
    </style>
</head>
<body>
    <div class="app">
        <!-- 头部 -->
        <div class="header">
            <div class="header-left">
                <span class="logo">🐼</span>
                <span class="title">TOKI</span>
                <span class="version">V4.0</span>
            </div>
        </div>
        
        <!-- AI状态 -->
        <div class="ai-status">
            ✅ 讯飞星火 Lite · 无限免费
        </div>
        
        <!-- 主内容 -->
        <div class="main" style="flex:1; display:flex; flex-direction:column;">
            <!-- 功能导航 -->
            <div class="feature-nav">
                <div class="nav-item active" onclick="switchFeature('chat')">
                    <span class="nav-icon">💬</span>

                </div>
                <div class="nav-item" onclick="switchFeature('agent')">
                    <span class="nav-icon">🤖</span>

                </div>
            </div>
            
            <!-- 内容区 -->
            <div class="content">
                <!-- 对话Tab -->
                <div class="tab active" id="chatTab">
                    <div class="chat-area" id="chatArea">
                        <div class="message bot">
                            <div class="bot-avatar">🐼</div>
                            <div class="bot-content">
                                <div class="bot-name">TOKI</div>
                                <div class="bot-text">
                                    你好！我是 TOKI 🐼<br><br>
                                    我已经连接了讯飞星火AI，可以真正和你对话了！<br><br>
                                    试试问我：<br>
                                    • 今天天气怎么样？<br>
                                    • 给我讲个笑话<br>
                                    • 帮我写一首诗
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 语音Tab -->
                <div class="tab" id="voiceTab">
                    <div class="panda-display">
                        <div class="panda-face" id="pandaFace">
                            <div class="panda-ear left"></div>
                            <div class="panda-ear right"></div>

                            <div class="panda-eye left"></div>
                            <div class="panda-eye right"></div>
                            <div class="panda-pupil left"></div>
                            <div class="panda-pupil right"></div>
                            <div class="panda-nose"></div>
                            <div class="panda-mouth"></div>
                        </div>

                <!-- 视频Tab -->
                <div class="tab" id="videoTab">

                        <div class="panda-face" id="pandaFace2">

                            <div class="panda-eye-patch left"></div>
                            <div class="panda-eye-patch right"></div>
                            <div class="panda-eye left"></div>
                            <div class="panda-eye right"></div>
                            <div class="panda-pupil left"></div>
                            <div class="panda-pupil right"></div>
                            <div class="panda-nose"></div>
                            <div class="panda-mouth"></div>
                        </div>
                        <div class="call-status">点击开始视频通话</div>
                        <div class="call-hint">和熊猫TOKI面对面聊天</div>
                        <button class="call-btn" onclick="alert('视频通话功能演示中...')">📹 开始通话</button>
                    </div>
                </div>
                
                <!-- 智能体Tab -->
                <div class="tab" id="agentTab">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 10px;">
                        <div class="agent-card" onclick="selectAgent('analyst')">
                            <div style="font-size: 32px; margin-bottom: 10px;">📊</div>
                            <div style="font-weight: 500;">数据分析师</div>
                        </div>
                        <div class="agent-card" onclick="selectAgent('business')">
                            <div style="font-size: 32px; margin-bottom: 10px;">💼</div>
                            <div style="font-weight: 500;">商务助手</div>
                        </div>
                        <div class="agent-card" onclick="selectAgent('tutor')">
                            <div style="font-size: 32px; margin-bottom: 10px;">📚</div>
                            <div style="font-weight: 500;">学习导师</div>
                        </div>
                        <div class="agent-card" onclick="selectAgent('coder')">
                            <div style="font-size: 32px; margin-bottom: 10px;">💻</div>
                            <div style="font-weight: 500;">编程助手</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 输入区 -->
            <div class="input-area">
                <div class="input-tools">
                    <button class="tool-btn" onclick="switchFeature('voice')">🎤 语音</button>
                    <button class="tool-btn" onclick="switchFeature('video')">📹 视频</button>
                </div>
                <div class="input-wrapper">
                    <div class="input-box">
                        <input type="text" id="inputText" placeholder="输入消息..." onkeydown="handleKeydown(event)">
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item-bottom active" onclick="switchBottomTab('chat')">
                <span class="nav-icon-bottom">💬</span>
                <span class="nav-label-bottom">对话</span>
            </div>
            <div class="nav-item-bottom" onclick="switchBottomTab('discover')">
                <span class="nav-icon-bottom">🔍</span>
                <span class="nav-label-bottom">发现</span>
            </div>
            <div class="nav-item-bottom" onclick="switchBottomTab('profile')">
                <span class="nav-icon-bottom">👤</span>
                <span class="nav-label-bottom">我的</span>
            </div>
        </div>
    </div>

    <script>
        // ============ 讯飞星火API配置（无限免费）============
        const SPARK_CONFIG = {
            APPID: '375ffe02',
            APIKey: 'a5f5156fb7cb051d55866912f67178d0',
            APISecret: 'ZGNkYWM3MmYyNmIzYjUwYTYwZGZmZjA5'
        };
        
        // 记忆系统
        const memory = {
            history: [],
            load() {
                try {
                    this.history = JSON.parse(localStorage.getItem('toki_history') || '[]');
                } catch(e) {}
            },
            save() {
                localStorage.setItem('toki_history', JSON.stringify(this.history.slice(-20)));
            },
            add(role, content) {
                this.history.push({ role, content, time: Date.now() });
                this.save();
            }
        };
        memory.load();
        
        // ============ 调用讯飞星火AI ============
        async function callSparkAI(message) {
            // 构建对话历史
            const history = memory.history.slice(-10).map(h => ({
                role: h.role === 'user' ? 'user' : 'assistant',
                content: h.content
            }));
            
            // 调用星火API（简化版，使用HTTP）
            try {
                const response = await fetch('https://spark-api-open.xf-yun.com/v1/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SPARK_CONFIG.APIKey}`
                    },
                    body: JSON.stringify({
                        model: 'spark-lite',
                        messages: [
                            { role: 'system', content: '你是TOKI，一只友善的熊猫AI助手。回答简洁友好，善用表情符号。名字叫TOKI，来自四川。' },
                            ...history,
                            { role: 'user', content: message }
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });
                
                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    return data.choices[0].message.content;
                }
            } catch (e) {
                console.log('星火API调用失败，使用模拟回复:', e);
            }
            
            // 备用：模拟回复
            const responses = [
                '好的，我明白了！🐼',
                '这个很有意思！让我想想...',
                '收到！我可以帮你处理。',
                '明白了！还有别的问题吗？',
                '好的，我记住了！',
                '没问题，我来帮你！',
                '这个简单，交给我吧！'
            ];
            return responses[Math.floor(Math.random() * responses.length)];
        }
        
        // ============ UI功能 ============
        
        function switchFeature(feature) {
            document.querySelectorAll('.feature-nav .nav-item').forEach(i => i.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(feature + 'Tab').classList.add('active');
        }
        
        function switchBottomTab(tab) {
            document.querySelectorAll('.nav-item-bottom').forEach(i => i.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        
        async function sendMessage() {
            const input = document.getElementById('inputText');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage('user', text);
            input.value = '';
            document.getElementById('sendBtn').disabled = true;
            
            showTyping();
            
            const response = await callSparkAI(text);
            
            memory.add('user', text);
            memory.add('assistant', response);
            
            hideTyping();
            addMessage('bot', response);
            
            document.getElementById('sendBtn').disabled = false;
        }
        
        function addMessage(type, text) {
            const chatArea = document.getElementById('chatArea');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.innerHTML = type === 'user' 
                ? `<div class="user-text">${text}</div>`
                : `<div class="bot-avatar">🐼</div>
                   <div class="bot-content">
                       <div class="bot-name">TOKI</div>
                       <div class="bot-text">${text}</div>
                   </div>`;
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function showTyping() {
            const chatArea = document.getElementById('chatArea');
            const t = document.createElement('div');
            t.id = 'typingIndicator';
            t.className = 'message bot';
            t.innerHTML = `<div class="bot-avatar">🐼</div>
                <div class="bot-content">
                    <div class="bot-name">TOKI</div>
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>`;
            chatArea.appendChild(t);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function hideTyping() {
            const t = document.getElementById('typingIndicator');
            if (t) t.remove();
        }
        
        function handleKeydown(e) {
            if (e.key === 'Enter') sendMessage();
        }
        
        // 语音通话
        let recognition = null;
        let isVoiceActive = false;
        
        function toggleVoiceCall() {
            if (isVoiceActive) {
                stopVoiceCall();
            } else {
                startVoiceCall();
            }
        }
        
        async function startVoiceCall() {
            if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                alert('请使用Chrome浏览器');
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'zh-CN';
            
            recognition.onresult = async (e) => {
                const text = e.results[e.results.length - 1][0].transcript;
                document.getElementById('voiceStatus').textContent = `你说: "${text}"`;
                
                // 显示说话动画
                document.getElementById('pandaFace').classList.add('speaking');
                
                const response = await callSparkAI(text);
                document.getElementById('voiceStatus').textContent = response;
                
                // 语音播报
                const utterance = new SpeechSynthesisUtterance(response);
                utterance.lang = 'zh-CN';
                utterance.onend = () => {
                    document.getElementById('pandaFace').classList.remove('speaking');
                };
                speechSynthesis.speak(utterance);
            };
            
            recognition.start();
            isVoiceActive = true;
            document.getElementById('voiceStatus').textContent = '正在聆听...请说话';
            document.getElementById('voiceBtn').textContent = '🔴 结束通话';
        }
        
        function stopVoiceCall() {
            if (recognition) {
                recognition.stop();
            }
            isVoiceActive = false;
            document.getElementById('voiceStatus').textContent = '点击开始语音通话';
            document.getElementById('voiceBtn').textContent = '🎤 开始通话';
            document.getElementById('pandaFace').classList.remove('speaking');
        }
        
        function selectAgent(agent) {
            const agents = {
                'analyst': '数据分析师',
                'business': '商务助手',
                'tutor': '学习导师',
                'coder': '编程助手'
            };
            switchFeature('chat');
            addMessage('bot', `已切换到${agents[agent]}模式 🎯\n有什么可以帮你的？`);
        }
