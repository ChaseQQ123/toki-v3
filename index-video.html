<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKI V2 - 视频通话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .video-call-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 头部 */
        .header {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            font-size: 28px;
        }
        
        .logo-text {
            font-size: 22px;
            font-weight: bold;
        }
        
        .version {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 10px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
        }
        
        .status-dot.connecting {
            background: #ff9800;
        }
        
        .status-dot.error {
            background: #f44336;
        }
        
        /* 视频区域 */
        .video-area {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        
        .video-wrapper {
            position: relative;
            background: #0f0f23;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .video-wrapper.waiting {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .waiting-text {
            color: white;
            font-size: 16px;
        }
        
        /* 控制区域 */
        .controls {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            transform: scale(1.1);
        }
        
        .control-btn.end-call {
            background: #f44336;
            color: white;
        }
        
        .control-btn.toggle {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .control-btn.toggle.active {
            background: #4CAF50;
        }
        
        .control-btn.toggle.muted {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
        }
        
        /* 房间信息 */
        .room-info {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
        }
        
        .room-info.hidden {
            display: none;
        }
        
        .room-info h2 {
            margin-bottom: 20px;
            color: #667eea;
        }
        
        .room-info input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            width: 200px;
            margin: 10px 0;
        }
        
        .room-info button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        .room-id-display {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .share-link {
            font-size: 12px;
            color: #666;
            margin: 10px 0;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .video-area {
                grid-template-columns: 1fr;
            }
            
            .controls {
                padding: 15px;
                gap: 10px;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="video-call-container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <span class="logo-text">TOKI</span>
                <span class="version">V2.0</span>
            </div>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">准备就绪</span>
            </div>
        </header>
        
        <!-- 视频区域 -->
        <div class="video-area">
            <!-- 本地视频 -->
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">我</div>
            </div>
            
            <!-- 远程视频 -->
            <div class="video-wrapper waiting" id="remoteVideoWrapper">
                <div class="waiting-text" id="remoteWaiting">等待对方加入...</div>
                <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
                <div class="video-label" id="remoteLabel" style="display:none;">对方</div>
            </div>
        </div>
        
        <!-- 控制区域 -->
        <div class="controls">
            <button class="control-btn toggle active" id="audioBtn" onclick="toggleAudio()">
                🎤
            </button>
            <button class="control-btn toggle active" id="videoBtn" onclick="toggleVideo()">
                📹
            </button>
            <button class="control-btn toggle" id="screenBtn" onclick="shareScreen()">
                🖥️
            </button>
            <button class="control-btn end-call" id="endCallBtn" onclick="endCall()">
                📞
            </button>
        </div>
    </div>
    
    <!-- 房间信息弹窗 -->
    <div class="room-info" id="roomInfo">
        <h2>📹 视频通话</h2>
        <p>选择操作：</p>
        <input type="text" id="roomIdInput" placeholder="输入房间ID（可选）">
        <br>
        <button onclick="createRoom()">创建房间</button>
        <button onclick="joinRoom()">加入房间</button>
    </div>
    
    <!-- 引入WebRTC客户端 -->
    <script src="video-call.js"></script>
    
    <script>
        // 初始化视频通话
        const videoCall = new TOKIVideoCall();
        
        // 状态元素
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const roomInfo = document.getElementById('roomInfo');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remoteWaiting = document.getElementById('remoteWaiting');
        const remoteLabel = document.getElementById('remoteLabel');
        const remoteVideoWrapper = document.getElementById('remoteVideoWrapper');
        const audioBtn = document.getElementById('audioBtn');
        const videoBtn = document.getElementById('videoBtn');
        
        // 设置回调
        videoCall.onSignalingConnected = () => {
            updateStatus('connected', '信令服务器已连接');
        };
        
        videoCall.onRemoteStreamReceived = (stream) => {
            console.log('✅ 显示远程视频');
            remoteVideo.srcObject = stream;
            remoteVideo.style.display = 'block';
            remoteLabel.style.display = 'block';
            remoteWaiting.style.display = 'none';
            remoteVideoWrapper.classList.remove('waiting');
            updateStatus('connected', '视频通话中');
        };
        
        videoCall.onConnectionStateChanged = (state) => {
            console.log('📊 连接状态:', state);
            
            if (state === 'connected') {
                updateStatus('connected', '通话中');
            } else if (state === 'connecting') {
                updateStatus('connecting', '连接中...');
            } else if (state === 'disconnected') {
                updateStatus('error', '连接断开');
            }
        };
        
        videoCall.onCallEnded = () => {
            updateStatus('idle', '通话结束');
            remoteVideo.srcObject = null;
            remoteVideo.style.display = 'none';
            remoteLabel.style.display = 'none';
            remoteWaiting.style.display = 'block';
            remoteWaiting.textContent = '等待对方加入...';
            remoteVideoWrapper.classList.add('waiting');
            
            // 显示房间信息
            roomInfo.classList.remove('hidden');
        };
        
        // 更新状态
        function updateStatus(type, text) {
            statusDot.className = 'status-dot';
            if (type === 'connecting') {
                statusDot.classList.add('connecting');
            } else if (type === 'error') {
                statusDot.classList.add('error');
            }
            statusText.textContent = text;
        }
        
        // 创建房间
        async function createRoom() {
            console.log('🏠 创建房间');
            
            try {
                // 初始化本地视频
                await videoCall.initializeLocalVideo();
                
                // 连接信令服务器
                videoCall.connectSignalingServer();
                
                // 创建房间
                videoCall.joinRoom();
                
                // 隐藏弹窗
                roomInfo.classList.add('hidden');
                
                // 显示房间ID
                updateStatus('connecting', '等待对方加入...');
                
                // 显示分享链接
                const shareLink = `${window.location.href}?room=${videoCall.roomId}`;
                console.log('🔗 分享链接:', shareLink);
                
                // TODO: 显示房间ID给用户
                
            } catch (error) {
                console.error('❌ 创建房间失败:', error);
                updateStatus('error', '创建失败');
            }
        }
        
        // 加入房间
        async function joinRoom() {
            const roomId = document.getElementById('roomIdInput').value.trim();
            console.log('🚪 加入房间:', roomId);
            
            try {
                // 初始化本地视频
                await videoCall.initializeLocalVideo();
                
                // 连接信令服务器
                videoCall.connectSignalingServer();
                
                // 加入房间
                setTimeout(() => {
                    videoCall.joinRoom(roomId);
                }, 1000);
                
                // 隐藏弹窗
                roomInfo.classList.add('hidden');
                
                updateStatus('connecting', '加入房间...');
                
            } catch (error) {
                console.error('❌ 加入房间失败:', error);
                updateStatus('error', '加入失败');
            }
        }
        
        // 切换音频
        function toggleAudio() {
            const enabled = videoCall.toggleAudio();
            audioBtn.classList.toggle('active', enabled);
            audioBtn.classList.toggle('muted', !enabled);
            audioBtn.textContent = enabled ? '🎤' : '🔇';
        }
        
        // 切换视频
        function toggleVideo() {
            const enabled = videoCall.toggleVideo();
            videoBtn.classList.toggle('active', enabled);
            videoBtn.classList.toggle('muted', !enabled);
            videoBtn.textContent = enabled ? '📹' : '📷';
        }
        
        // 分享屏幕（可选）
        async function shareScreen() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true
                });
                
                // 替换视频轨道
                const videoTrack = screenStream.getVideoTracks()[0];
                const sender = videoCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) {
                    sender.replaceTrack(videoTrack);
                }
                
                // 显示本地屏幕
                localVideo.srcObject = screenStream;
                
                console.log('🖥️ 屏幕共享已开始');
                
            } catch (error) {
                console.error('❌ 屏幕共享失败:', error);
            }
        }
        
        // 结束通话
        function endCall() {
            videoCall.endCall();
        }
        
        // 检查URL参数（自动加入房间）
        const urlParams = new URLSearchParams(window.location.search);
        const autoRoomId = urlParams.get('room');
        
        if (autoRoomId) {
            console.log('🔗 自动加入房间:', autoRoomId);
            document.getElementById('roomIdInput').value = autoRoomId;
            
            setTimeout(() => {
                joinRoom();
            }, 500);
        }
        
        console.log('✅ TOKI V2 视频通话已初始化');
    </script>
</body>
</html>
