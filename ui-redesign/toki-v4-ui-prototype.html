<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKI V4.0 - 对标豆包</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        
        /* 手机容器 */
        .phone-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        /* ============ 顶部栏 ============ */
        .header {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panda-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .header-right {
            display: flex;
            gap: 15px;
        }
        .header-btn {
            font-size: 20px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .header-btn:hover {
            opacity: 1;
        }
        
        /* ============ 对话区域 ============ */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        
        /* 消息 */
        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* AI消息 */
        .message.bot {
            display: flex;
            gap: 12px;
        }
        .bot-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .bot-content {
            flex: 1;
        }
        .bot-name {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }
        .bot-text {
            background: white;
            padding: 12px 16px;
            border-radius: 16px 16px 16px 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }
        
        /* 用户消息 */
        .message.user {
            display: flex;
            justify-content: flex-end;
        }
        .user-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 16px 16px 4px 16px;
            font-size: 15px;
            line-height: 1.6;
            max-width: 80%;
        }
        
        /* 消息操作 */
        .message-actions {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            padding-left: 48px;
        }
        .action-btn {
            font-size: 12px;
            color: #999;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.3s;
        }
        .action-btn:hover {
            color: #667eea;
        }
        
        /* ============ 输入区域 ============ */
        .input-area {
            background: white;
            padding: 15px 20px;
            border-top: 1px solid #f0f0f0;
        }
        
        /* 功能按钮 */
        .input-tools {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
        }
        .tool-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: #f5f5f5;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tool-btn:hover {
            background: #667eea;
            color: white;
        }
        
        /* 输入框 */
        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-box {
            flex: 1;
            background: #f5f5f5;
            border-radius: 24px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
        }
        .input-box textarea {
            flex: 1;
            border: none;
            background: none;
            resize: none;
            font-size: 15px;
            line-height: 1.4;
            max-height: 100px;
            outline: none;
        }
        .send-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .send-btn:hover {
            transform: scale(1.1);
        }
        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        /* ============ 底部导航 ============ */
        .bottom-nav {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 5px 20px;
            transition: all 0.3s;
        }
        .nav-item.active {
            color: #667eea;
        }
        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }
        .nav-icon {
            font-size: 24px;
            transition: transform 0.3s;
        }
        .nav-label {
            font-size: 11px;
            color: inherit;
        }
        
        /* ============ 历史对话面板 ============ */
        .history-panel {
            position: absolute;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: white;
            z-index: 20;
            transition: left 0.3s;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .history-panel.open {
            left: 0;
        }
        .history-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-title {
            font-size: 18px;
            font-weight: 600;
        }
        .history-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .history-list {
            padding: 10px;
            overflow-y: auto;
            height: calc(100% - 60px);
        }
        .history-item {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .history-item:hover {
            background: #f5f5f5;
        }
        .history-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .history-item-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .history-item-preview {
            font-size: 12px;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 遮罩 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* ============ 语音播报 ============ */
        .voice-play {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: #f0f0ff;
            border-radius: 20px;
            font-size: 13px;
            color: #667eea;
            cursor: pointer;
            margin-top: 8px;
        }
        .voice-play.playing {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 历史对话面板 -->
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <span class="history-title">历史对话</span>
                <span class="history-close" onclick="toggleHistory()">×</span>
            </div>
            <div class="history-list">
                <div class="history-item active">
                    <div class="history-item-title">当前对话</div>
                    <div class="history-item-preview">你好，我是 TOKI...</div>
                </div>
                <div class="history-item">
                    <div class="history-item-title">Python 编程帮助</div>
                    <div class="history-item-preview">帮我写一个快速排序...</div>
                </div>
                <div class="history-item">
                    <div class="history-item-title">旅行规划</div>
                    <div class="history-item-preview">推荐成都三日游路线...</div>
                </div>
                <div class="history-item">
                    <div class="history-item-title">学习计划</div>
                    <div class="history-item-preview">制定英语学习计划...</div>
                </div>
            </div>
        </div>
        
        <!-- 遮罩 -->
        <div class="overlay" id="overlay" onclick="toggleHistory()"></div>
        
        <!-- 顶部栏 -->
        <div class="header">
            <div class="header-left">
                <span class="header-btn" onclick="toggleHistory()">☰</span>
                <div class="panda-icon">🐼</div>
                <span class="header-title">TOKI</span>
            </div>
            <div class="header-right">
                <span class="header-btn">⋮</span>
            </div>
        </div>
        
        <!-- 对话区域 -->
        <div class="chat-area" id="chatArea">
            <!-- AI消息 -->
            <div class="message bot">
                <div class="bot-avatar">🐼</div>
                <div class="bot-content">
                    <div class="bot-name">TOKI</div>
                    <div class="bot-text">
                        你好！我是 TOKI，一只来自四川的熊猫 AI 助手 🐼
                        <br><br>
                        我可以帮你：
                        <br>• 💬 聊天对话
                        <br>• 🎤 语音通话
                        <br>• 📹 视频通话
                        <br>• 📝 写作创作
                        <br>• 🔍 网络搜索
                        <br><br>
                        有什么我可以帮你的吗？
                    </div>
                    <div class="voice-play" onclick="playVoice(this)">
                        🔊 播报
                    </div>
                    <div class="message-actions">
                        <span class="action-btn" onclick="copyMessage()">📋 复制</span>
                        <span class="action-btn" onclick="regenerate()">🔄 重新生成</span>
                        <span class="action-btn" onclick="collectMessage()">⭐ 收藏</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 输入区域 -->
        <div class="input-area">
            <div class="input-tools">
                <button class="tool-btn" onclick="startVoiceCall()">
                    🎤 语音通话
                </button>
                <button class="tool-btn" onclick="startVideoCall()">
                    📹 视频通话
                </button>
                <button class="tool-btn" onclick="openFileUpload()">
                    📁 文件
                </button>
            </div>
            <div class="input-wrapper">
                <div class="input-box">
                    <textarea id="inputText" placeholder="输入消息..." rows="1" onkeydown="handleKeydown(event)"></textarea>
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    ➤
                </button>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('chat')">
                <span class="nav-icon">💬</span>
                <span class="nav-label">对话</span>
            </div>
            <div class="nav-item" onclick="switchTab('discover')">
                <span class="nav-icon">🔍</span>
                <span class="nav-label">发现</span>
            </div>
            <div class="nav-item" onclick="switchTab('create')">
                <span class="nav-icon">✨</span>
                <span class="nav-label">创作</span>
            </div>
            <div class="nav-item" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-label">我的</span>
            </div>
        </div>
    </div>

    <script>
        // ============ 历史对话面板 ============
        function toggleHistory() {
            const panel = document.getElementById('historyPanel');
            const overlay = document.getElementById('overlay');
            panel.classList.toggle('open');
            overlay.classList.toggle('visible');
        }

        // ============ 发送消息 ============
        function sendMessage() {
            const input = document.getElementById('inputText');
            const text = input.value.trim();
            
            if (!text) return;
            
            // 添加用户消息
            addMessage('user', text);
            input.value = '';
            
            // 模拟AI回复
            setTimeout(() => {
                const responses = [
                    '好的，我明白了！有什么其他问题吗？',
                    '这个话题很有意思，让我想想...',
                    '我可以帮你处理这个！',
                    '明白了，我这就开始处理。',
                    '好的，请稍等...'
                ];
                const response = responses[Math.floor(Math.random() * responses.length)];
                addMessage('bot', response);
            }, 1000);
        }

        function addMessage(type, text) {
            const chatArea = document.getElementById('chatArea');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            
            if (type === 'user') {
                message.innerHTML = `<div class="user-text">${text}</div>`;
            } else {
                message.innerHTML = `
                    <div class="bot-avatar">🐼</div>
                    <div class="bot-content">
                        <div class="bot-name">TOKI</div>
                        <div class="bot-text">${text}</div>
                        <div class="voice-play" onclick="playVoice(this)">🔊 播报</div>
                        <div class="message-actions">
                            <span class="action-btn" onclick="copyMessage()">📋 复制</span>
                            <span class="action-btn" onclick="regenerate()">🔄 重新生成</span>
                            <span class="action-btn" onclick="collectMessage()">⭐ 收藏</span>
                        </div>
                    </div>
                `;
            }
            
            chatArea.appendChild(message);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // ============ 语音播报 ============
        function playVoice(btn) {
            if ('speechSynthesis' in window) {
                const text = btn.parentElement.querySelector('.bot-text').textContent;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                
                btn.classList.add('playing');
                btn.textContent = '🔊 播放中...';
                
                utterance.onend = () => {
                    btn.classList.remove('playing');
                    btn.textContent = '🔊 播报';
                };
                
                speechSynthesis.speak(utterance);
            } else {
                alert('浏览器不支持语音合成');
            }
        }

        // ============ 消息操作 ============
        function copyMessage() {
            alert('已复制到剪贴板');
        }

        function regenerate() {
            alert('重新生成中...');
        }

        function collectMessage() {
            alert('已收藏');
        }

        // ============ 功能按钮 ============
        function startVoiceCall() {
            alert('即将开始语音通话...');
        }

        function startVideoCall() {
            alert('即将开始视频通话...');
        }

        function openFileUpload() {
            alert('打开文件上传...');
        }

        // ============ 底部导航 ============
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // 可以根据 tab 切换不同页面
            console.log('Switch to:', tab);
        }

        // ============ 初始化 ============
        console.log('🐼 TOKI V4.0 已加载');
    </script>
</body>
</html>
