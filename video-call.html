<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKI - AI视频通话</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 头部 */
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .timer {
            font-size: 18px;
            font-weight: bold;
        }
        
        /* AI形象区域 */
        .ai-avatar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .ai-avatar {
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(255,255,255,0.3);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .ai-status {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .ai-message {
            background: rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 20px;
            max-width: 80%;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            min-height: 60px;
        }
        
        /* 对话历史 */
        .chat-history {
            max-height: 150px;
            overflow-y: auto;
            padding: 0 20px;
            margin-bottom: 20px;
        }
        
        .chat-message {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 12px;
            font-size: 14px;
        }
        
        .chat-message.user {
            background: rgba(255,255,255,0.2);
            margin-left: auto;
            max-width: 70%;
        }
        
        .chat-message.ai {
            background: rgba(0,0,0,0.2);
            max-width: 70%;
        }
        
        /* 控制按钮 */
        .controls {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .start-btn {
            background: #4CAF50;
            color: white;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .start-btn:hover {
            transform: scale(1.1);
        }
        
        .end-btn {
            background: #ff4444;
            color: white;
        }
        
        .end-btn:hover {
            transform: scale(1.1);
        }
        
        .mute-btn {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .mute-btn.active {
            background: #ff8800;
        }
        
        /* 提示信息 */
        .hint {
            text-align: center;
            padding: 10px 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <div class="timer" id="timer">00:00</div>
        </div>
        
        <!-- AI形象区域 -->
        <div class="ai-avatar-container">
            <div class="ai-avatar" id="aiAvatar">🤖</div>
            <div class="ai-status" id="aiStatus">点击开始与TOKI视频通话</div>
            <div class="ai-message" id="aiMessage">你好！我是TOKI，你的AI助手。点击下方绿色按钮开始语音对话吧！</div>
        </div>
        
        <!-- 对话历史 -->
        <div class="chat-history" id="chatHistory" style="display:none;"></div>
        
        <!-- 控制按钮 -->
        <div class="controls">
            <button class="mute-btn" id="muteBtn" onclick="toggleMute()" style="display:none;">🎤</button>
            <button class="start-btn" id="startBtn" onclick="startCall()">📞</button>
            <button class="end-btn" id="endBtn" onclick="endCall()" style="display:none;">📞</button>
        </div>
        
        <!-- 提示 -->
        <div class="hint" id="hint">语音识别需要Chrome浏览器</div>
    </div>
    
    <script>
        // API配置
        const API_KEY = 'c4911cf15f844167bd26301e25622cf1.n1BU10ytXbnQ6N5d';
        const BASE_URL = 'https://open.bigmodel.cn/api/paas/v4';
        
        // 状态管理
        let isCallActive = false;
        let isMuted = false;
        let callStartTime = null;
        let timerInterval = null;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let conversationHistory = [];
        
        // 初始化语音识别
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'zh-CN';
                
                recognition.onresult = async (event) => {
                    const last = event.results.length - 1;
                    const text = event.results[last][0].transcript;
                    
                    console.log('识别到语音:', text);
                    addChatMessage(text, 'user');
                    await processUserInput(text);
                };
                
                recognition.onerror = (event) => {
                    console.error('语音识别错误:', event.error);
                    updateAIStatus('语音识别出错，请重试');
                };
                
                recognition.onend = () => {
                    if (isCallActive && !isMuted) {
                        // 如果通话还在进行且未静音，继续监听
                        recognition.start();
                    }
                };
                
                return true;
            }
            return false;
        }
        
        // 返回
        function goBack() {
            endCall();
            window.location.href = 'index.html';
        }
        
        // 开始通话
        function startCall() {
            if (!initSpeechRecognition()) {
                alert('你的浏览器不支持语音识别，请使用Chrome浏览器');
                return;
            }
            
            isCallActive = true;
            callStartTime = Date.now();
            
            // 更新UI
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('endBtn').style.display = 'flex';
            document.getElementById('muteBtn').style.display = 'flex';
            document.getElementById('chatHistory').style.display = 'block';
            document.getElementById('hint').textContent = '正在聆听...说出你的问题';
            
            // 启动计时器
            timerInterval = setInterval(updateTimer, 1000);
            
            // 开始语音识别
            recognition.start();
            
            // AI问候
            speak('你好！我是TOKI，有什么可以帮你的吗？');
            updateAIMessage('你好！我是TOKI，有什么可以帮你的吗？');
            updateAIStatus('正在聆听...');
        }
        
        // 结束通话
        function endCall() {
            isCallActive = false;
            
            // 停止语音识别
            if (recognition) {
                recognition.stop();
            }
            
            // 停止语音合成
            if (synthesis) {
                synthesis.cancel();
            }
            
            // 停止计时器
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // 更新UI
            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('endBtn').style.display = 'none';
            document.getElementById('muteBtn').style.display = 'none';
            document.getElementById('aiStatus').textContent = '通话已结束';
            document.getElementById('hint').textContent = '点击绿色按钮重新开始';
        }
        
        // 切换静音
        function toggleMute() {
            isMuted = !isMuted;
            const muteBtn = document.getElementById('muteBtn');
            muteBtn.textContent = isMuted ? '🔇' : '🎤';
            muteBtn.classList.toggle('active', isMuted);
            
            if (isMuted) {
                recognition.stop();
                updateAIStatus('已静音');
            } else {
                recognition.start();
                updateAIStatus('正在聆听...');
            }
        }
        
        // 处理用户输入
        async function processUserInput(text) {
            updateAIStatus('思考中...');
            
            try {
                // 添加到对话历史
                conversationHistory.push({ role: 'user', content: text });
                
                // 调用AI API
                const response = await fetch(`${BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'glm-4-flash',
                        messages: [
                            {
                                role: 'system',
                                content: '你是TOKI，一个友好、专业的AI助手。请用简洁、自然的口语回答，适合语音输出。回答长度控制在50字以内。'
                            },
                            ...conversationHistory.slice(-10) // 保留最近10轮对话
                        ]
                    })
                });
                
                const data = await response.json();
                const reply = data.choices[0].message.content;
                
                // 添加到对话历史
                conversationHistory.push({ role: 'assistant', content: reply });
                
                // 更新UI
                addChatMessage(reply, 'ai');
                updateAIMessage(reply);
                updateAIStatus('正在聆听...');
                
                // 语音输出
                speak(reply);
                
            } catch (error) {
                console.error('API调用失败:', error);
                updateAIStatus('网络错误，请重试');
            }
        }
        
        // 语音合成
        function speak(text) {
            if (synthesis) {
                synthesis.cancel(); // 停止之前的语音
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                
                // 尝试使用女声
                const voices = synthesis.getVoices();
                const femaleVoice = voices.find(v => v.lang.includes('zh') && v.name.includes('Female'));
                if (femaleVoice) {
                    utterance.voice = femaleVoice;
                }
                
                utterance.onstart = () => {
                    updateAIStatus('正在说话...');
                    document.getElementById('aiAvatar').style.animation = 'pulse 0.5s ease-in-out infinite';
                };
                
                utterance.onend = () => {
                    document.getElementById('aiAvatar').style.animation = 'pulse 2s ease-in-out infinite';
                    if (isCallActive && !isMuted) {
                        updateAIStatus('正在聆听...');
                    }
                };
                
                synthesis.speak(utterance);
            }
        }
        
        // 更新计时器
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }
        
        // 更新AI状态
        function updateAIStatus(status) {
            document.getElementById('aiStatus').textContent = status;
        }
        
        // 更新AI消息
        function updateAIMessage(message) {
            document.getElementById('aiMessage').textContent = message;
        }
        
        // 添加聊天消息
        function addChatMessage(text, type) {
            const chatHistory = document.getElementById('chatHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${type}`;
            messageDiv.textContent = text;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        // 加载语音
        if (synthesis) {
            synthesis.onvoiceschanged = () => {
                synthesis.getVoices();
            };
        }
    </script>
</body>
</html>
