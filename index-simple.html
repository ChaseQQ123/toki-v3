<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKI - AI助手</title>
    
    <!-- PWA配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TOKI">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #FFFFFF;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* 主容器 */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            margin: 0 auto;
            background: #FFFFFF;
            position: relative;
        }
        
        /* 顶部栏 - 极简 */
        .header {
            height: 56px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            border-bottom: 0.5px solid #F0F0F0;
            flex-shrink: 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo-icon {
            font-size: 28px;
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .menu-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        
        .menu-btn:active {
            background: #F5F5F5;
        }
        
        /* 对话区域 - 全屏 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 欢迎消息 */
        .welcome-message {
            text-align: center;
            padding: 60px 20px;
        }
        
        .welcome-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        .welcome-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .welcome-subtitle {
            font-size: 14px;
            color: #999;
            line-height: 1.6;
        }
        
        /* 消息气泡 */
        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: #F5F5F5;
        }
        
        .message.user .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
        }
        
        .message.bot .message-content {
            background: #F5F5F5;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message-content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }
        
        /* 语音播报按钮 */
        .speak-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            padding: 4px 12px;
            background: #E3F2FD;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            color: #1976D2;
            cursor: pointer;
        }
        
        .speak-btn:active {
            background: #BBDEFB;
        }
        
        /* 底部输入区域 */
        .input-container {
            padding: 12px 16px;
            background: #FFFFFF;
            border-top: 0.5px solid #F0F0F0;
            flex-shrink: 0;
        }
        
        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #F5F5F5;
            border-radius: 24px;
            padding: 8px 12px;
            min-height: 44px;
        }
        
        .input-wrapper:focus-within {
            background: #FFF;
            box-shadow: 0 0 0 1px #667eea;
        }
        
        #userInput {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            max-height: 100px;
            outline: none;
            font-family: inherit;
        }
        
        #userInput::placeholder {
            color: #999;
        }
        
        .input-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        
        .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .action-btn:active {
            background: rgba(0, 0, 0, 0.05);
        }
        
        .action-btn.send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .action-btn.send:disabled {
            opacity: 0.5;
        }
        
        .action-btn.recording {
            background: #F44336;
            color: white;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* 侧边栏 */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: #FFFFFF;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar.open {
            left: 0;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 0.5px solid #F0F0F0;
        }
        
        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        
        .sidebar-subtitle {
            font-size: 12px;
            color: #999;
        }
        
        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .menu-item:active {
            background: #F5F5F5;
        }
        
        .menu-icon {
            font-size: 20px;
        }
        
        .menu-label {
            font-size: 15px;
            color: #333;
        }
        
        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* 快捷建议 */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px;
        }
        
        .suggestion-chip {
            padding: 8px 16px;
            background: #F5F5F5;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .suggestion-chip:active {
            background: #E0E0E0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部栏 -->
        <header class="header">
            <div class="header-left">
                <span class="logo-icon">🤖</span>
                <span class="logo-text">TOKI</span>
            </div>
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        </header>
        
        <!-- 对话区域 -->
        <main class="chat-container" id="chatContainer">
            <!-- 欢迎消息 -->
            <div class="welcome-message">
                <div class="welcome-icon">👋</div>
                <div class="welcome-title">你好，我是TOKI</div>
                <div class="welcome-subtitle">
                    我是你的AI助手，可以帮你：<br>
                    💬 回答问题、聊天对话<br>
                    🎨 生成图片（说"画一只猫"）<br>
                    📸 识别图片内容<br>
                    🎤 语音对话（点击麦克风）<br>
                    🎬 生成视频
                </div>
            </div>
            
            <!-- 快捷建议 -->
            <div class="suggestions" id="suggestions">
                <button class="suggestion-chip" onclick="sendQuickMessage('介绍一下你自己')">介绍一下你自己</button>
                <button class="suggestion-chip" onclick="sendQuickMessage('画一只可爱的猫咪')">画一只可爱的猫咪</button>
                <button class="suggestion-chip" onclick="sendQuickMessage('今天天气怎么样')">今天天气怎么样</button>
                <button class="suggestion-chip" onclick="sendQuickMessage('写一首关于春天的诗')">写一首关于春天的诗</button>
            </div>
        </main>
        
        <!-- 底部输入区域 -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="输入消息..." onkeydown="handleKeyDown(event)"></textarea>
                <div class="input-actions">
                    <button class="action-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
                    <button class="action-btn send" id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">功能菜单</div>
            <div class="sidebar-subtitle">更多功能等你探索</div>
        </div>
        <nav class="sidebar-menu">
            <div class="menu-item" onclick="switchMode('chat')">
                <span class="menu-icon">💬</span>
                <span class="menu-label">智能对话</span>
            </div>
            <div class="menu-item" onclick="switchMode('image')">
                <span class="menu-icon">🎨</span>
                <span class="menu-label">图像生成</span>
            </div>
            <div class="menu-item" onclick="switchMode('vision')">
                <span class="menu-icon">📸</span>
                <span class="menu-label">图像识别</span>
            </div>
            <div class="menu-item" onclick="switchMode('video')">
                <span class="menu-icon">🎬</span>
                <span class="menu-label">视频生成</span>
            </div>
            <div class="menu-item" onclick="switchMode('agents')">
                <span class="menu-icon">🤖</span>
                <span class="menu-label">智能体</span>
            </div>
            <div class="menu-item" onclick="switchMode('tools')">
                <span class="menu-icon">🛠️</span>
                <span class="menu-label">工具箱</span>
            </div>
            <div class="menu-item" onclick="showMemory()">
                <span class="menu-icon">🧠</span>
                <span class="menu-label">记忆系统</span>
            </div>
            <div class="menu-item" onclick="clearChat()">
                <span class="menu-icon">🗑️</span>
                <span class="menu-label">清除对话</span>
            </div>
        </nav>
    </div>
    
    <!-- 遮罩层 -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    
    <script>
        // API配置
        const BASE_URL = 'https://open.bigmodel.cn/api/paas/v4';
        const API_KEY = '9cae1ef67a4c4f31b30bb1f0b32f39e2.bO8PqKcVnJmVbNgm';
        
        // 状态变量
        let isRecording = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let conversationHistory = [];
        
        // 初始化语音识别
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'zh-CN';
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('userInput').value = transcript;
                    stopRecording();
                };
                
                recognition.onerror = function(event) {
                    console.error('语音识别错误:', event.error);
                    stopRecording();
                };
                
                recognition.onend = function() {
                    stopRecording();
                };
            }
        }
        
        // 切换语音录制
        function toggleVoice() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        function startRecording() {
            if (recognition) {
                isRecording = true;
                document.getElementById('voiceBtn').classList.add('recording');
                recognition.start();
            } else {
                alert('您的浏览器不支持语音识别');
            }
        }
        
        function stopRecording() {
            isRecording = false;
            document.getElementById('voiceBtn').classList.remove('recording');
            if (recognition) {
                recognition.stop();
            }
        }
        
        // 语音播报
        function speak(text) {
            if (synthesis) {
                // 停止当前播放
                synthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                synthesis.speak(utterance);
            }
        }
        
        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 隐藏欢迎消息和建议
            const welcome = document.querySelector('.welcome-message');
            const suggestions = document.getElementById('suggestions');
            if (welcome) welcome.style.display = 'none';
            if (suggestions) suggestions.style.display = 'none';
            
            // 添加用户消息
            addMessage(message, 'user');
            input.value = '';
            
            // 显示加载动画
            const loadingId = showLoading();
            
            try {
                const reply = await callAPI(message);
                
                // 移除加载动画
                removeLoading(loadingId);
                
                // 添加机器人回复
                addMessage(reply, 'bot');
                
            } catch (error) {
                removeLoading(loadingId);
                addMessage('抱歉，我遇到了一些问题，请稍后再试。', 'bot');
                console.error('API错误:', error);
            }
            
            // 滚动到底部
            scrollToBottom();
        }
        
        // 快捷消息
        function sendQuickMessage(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }
        
        // 添加消息到界面
        function addMessage(content, type) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = type === 'user' ? '👤' : '🤖';
            
            let contentHtml = content;
            
            // 检查是否是图片
            if (content.includes('<img')) {
                contentHtml = content;
            }
            
            messageDiv.innerHTML = `
                <div class="avatar">${avatar}</div>
                <div class="message-content">
                    ${contentHtml}
                    ${type === 'bot' ? '<button class="speak-btn" onclick="speak(\'' + content.replace(/<[^>]*>/g, '').replace(/'/g, "\\'") + '\')">🔊 播报</button>' : ''}
                </div>
            `;
            
            container.appendChild(messageDiv);
            
            // 保存到对话历史
            conversationHistory.push({
                role: type === 'user' ? 'user' : 'assistant',
                content: content.replace(/<[^>]*>/g, '')
            });
        }
        
        // 显示加载动画
        function showLoading() {
            const container = document.getElementById('chatContainer');
            const loadingDiv = document.createElement('div');
            const loadingId = 'loading-' + Date.now();
            loadingDiv.id = loadingId;
            loadingDiv.className = 'message bot';
            loadingDiv.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(loadingDiv);
            return loadingId;
        }
        
        // 移除加载动画
        function removeLoading(loadingId) {
            const loading = document.getElementById(loadingId);
            if (loading) {
                loading.remove();
            }
        }
        
        // 调用API
        async function callAPI(message) {
            // 判断是否是图像生成
            if (message.includes('画') || message.includes('生成图')) {
                return await generateImage(message);
            }
            
            // 普通对话
            const messages = [
                ...conversationHistory.slice(-10),
                { role: 'user', content: message }
            ];
            
            const response = await fetch(`${BASE_URL}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'glm-4-flash',
                    messages: messages
                })
            });
            
            if (!response.ok) {
                throw new Error('API请求失败');
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }
        
        // 图像生成
        async function generateImage(prompt) {
            const response = await fetch(`${BASE_URL}/images/generations`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'cogview-3-flash',
                    prompt: prompt
                })
            });
            
            if (!response.ok) {
                throw new Error('图像生成失败');
            }
            
            const data = await response.json();
            const imageUrl = data.data[0].url;
            
            return `<img src="${imageUrl}" alt="生成的图片" style="max-width:100%;border-radius:8px;">`;
        }
        
        // 滚动到底部
        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }
        
        // 处理回车键
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        // 切换侧边栏
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        // 关闭侧边栏
        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }
        
        // 切换模式
        function switchMode(mode) {
            closeSidebar();
            // 这里可以添加不同模式的处理逻辑
            let hint = '';
            switch(mode) {
                case 'image':
                    hint = '请在输入框输入你想画的图片描述，例如"画一只可爱的猫咪"';
                    break;
                case 'vision':
                    hint = '图像识别功能开发中...';
                    break;
                case 'video':
                    hint = '视频生成功能开发中...';
                    break;
                case 'agents':
                    hint = '智能体功能开发中...';
                    break;
                case 'tools':
                    hint = '工具箱功能开发中...';
                    break;
                default:
                    return;
            }
            if (hint) {
                addMessage(hint, 'bot');
                scrollToBottom();
            }
        }
        
        // 显示记忆
        function showMemory() {
            closeSidebar();
            addMessage('记忆系统功能开发中...', 'bot');
            scrollToBottom();
        }
        
        // 清除对话
        function clearChat() {
            closeSidebar();
            const container = document.getElementById('chatContainer');
            container.innerHTML = `
                <div class="welcome-message">
                    <div class="welcome-icon">👋</div>
                    <div class="welcome-title">你好，我是TOKI</div>
                    <div class="welcome-subtitle">
                        我是你的AI助手，可以帮你：<br>
                        💬 回答问题、聊天对话<br>
                        🎨 生成图片（说"画一只猫"）<br>
                        📸 识别图片内容<br>
                        🎤 语音对话（点击麦克风）<br>
                        🎬 生成视频
                    </div>
                </div>
                <div class="suggestions" id="suggestions">
                    <button class="suggestion-chip" onclick="sendQuickMessage('介绍一下你自己')">介绍一下你自己</button>
                    <button class="suggestion-chip" onclick="sendQuickMessage('画一只可爱的猫咪')">画一只可爱的猫咪</button>
                    <button class="suggestion-chip" onclick="sendQuickMessage('今天天气怎么样')">今天天气怎么样</button>
