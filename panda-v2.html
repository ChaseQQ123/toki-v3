<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKI熊猫 - 更像熊猫版本</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .panda-wrapper {
            margin: 20px 0;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .desc {
            color: #666;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐼 TOKI熊猫形象 V2</h1>
        
        <div class="panda-wrapper">
            <!-- 标准熊猫SVG -->
            <svg width="300" height="300" viewBox="0 0 300 300">
                <!-- 背景 -->
                <circle cx="150" cy="150" r="145" fill="#f0f0f0"/>
                
                <!-- 身体 - 白色 -->
                <ellipse cx="150" cy="230" rx="80" ry="60" fill="#FFFFFF" stroke="#e0e0e0" stroke-width="2"/>
                
                <!-- 头部 - 白色圆形 -->
                <circle cx="150" cy="130" r="85" fill="#FFFFFF" stroke="#e0e0e0" stroke-width="2"/>
                
                <!-- 左耳朵 - 黑色 -->
                <ellipse cx="75" cy="60" rx="28" ry="32" fill="#000000"/>
                <ellipse cx="75" cy="65" rx="16" ry="18" fill="#2a2a2a"/>
                
                <!-- 右耳朵 - 黑色 -->
                <ellipse cx="225" cy="60" rx="28" ry="32" fill="#000000"/>
                <ellipse cx="225" cy="65" rx="16" ry="18" fill="#2a2a2a"/>
                
                <!-- 左眼圈 - 标准熊猫黑眼圈 -->
                <ellipse cx="110" cy="120" rx="38" ry="42" fill="#000000" transform="rotate(-20 110 120)"/>
                <!-- 左眼白 -->
                <ellipse cx="108" cy="118" rx="16" ry="20" fill="#FFFFFF" transform="rotate(-20 108 118)"/>
                <!-- 左眼珠 - 紫色AI眼睛 -->
                <circle cx="108" cy="118" r="10" fill="#667eea"/>
                <circle cx="111" cy="115" r="4" fill="#FFFFFF"/>
                
                <!-- 右眼圈 - 标准熊猫黑眼圈 -->
                <ellipse cx="190" cy="120" rx="38" ry="42" fill="#000000" transform="rotate(20 190 120)"/>
                <!-- 右眼白 -->
                <ellipse cx="192" cy="118" rx="16" ry="20" fill="#FFFFFF" transform="rotate(20 192 118)"/>
                <!-- 右眼珠 - 紫色AI眼睛 -->
                <circle cx="192" cy="118" r="10" fill="#667eea"/>
                <circle cx="195" cy="115" r="4" fill="#FFFFFF"/>
                
                <!-- 鼻子 - 黑色椭圆 -->
                <ellipse cx="150" cy="160" rx="15" ry="10" fill="#000000"/>
                
                <!-- 嘴巴 - 弯曲的微笑 -->
                <path d="M 130 175 Q 150 190 170 175" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
                
                <!-- 腮红 - 粉色 -->
                <ellipse cx="80" cy="150" rx="15" ry="10" fill="#FFB6C1" opacity="0.5"/>
                <ellipse cx="220" cy="150" rx="15" ry="10" fill="#FFB6C1" opacity="0.5"/>
                
                <!-- 左手臂 - 黑色 -->
                <ellipse cx="75" cy="210" rx="22" ry="35" fill="#000000"/>
                
                <!-- 右手臂 - 黑色 -->
                <ellipse cx="225" cy="210" rx="22" ry="35" fill="#000000"/>
                
                <!-- 左腿 - 黑色 -->
                <ellipse cx="110" cy="280" rx="32" ry="20" fill="#000000"/>
                
                <!-- 右腿 - 黑色 -->
                <ellipse cx="190" cy="280" rx="32" ry="20" fill="#000000"/>
                
                <!-- TOKI文字 -->
                <text x="150" y="305" text-anchor="middle" font-size="18" font-weight="bold" fill="#667eea">TOKI</text>
                
                <!-- AI标识 - 小星星 -->
                <circle cx="150" cy="60" r="6" fill="#667eea" opacity="0.8"/>
                <circle cx="150" cy="60" r="3" fill="#764ba2"/>
            </svg>
        </div>
        
        <div class="desc">
            <p><strong>标准熊猫特点：</strong></p>
            <p>✅ 标志性大黑眼圈（最重要的特征）</p>
            <p>✅ 圆圆的白脑袋</p>
            <p>✅ 黑耳朵</p>
            <p>✅ 黑白分明</p>
            <p>✅ 圆润可爱的身体</p>
            <p><strong>TOKI特色：</strong></p>
            <p>💜 紫色眼睛（AI智能）</p>
            <p>😊 微笑表情（友好亲切）</p>
        </div>
    </div>
</body>
</html>
